<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LETHE // 기억 삭제 클리닉</title>
<style>
/* =========================================================
   테마 변수
   ========================================================= */
:root {
  --bg: #0a0a12;
  --panel: #10101c;
  --panel2: #161627;
  --line: #2a2a48;
  --cyan: #00f0ff;
  --mag: #ff2bd6;
  --red: #ff3b4e;
  --yellow: #ffd23f;
  --green: #39ff9f;
  --text: #d8f4ff;
  --dim: #7a86a6;
  --font: 'D2Coding', 'Nanum Gothic Coding', 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font); }
body {
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden; line-height: 1.6; font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }

/* =========================================================
   오버레이: 스캔라인 / 경고 테두리 / 글리치 / 토스트 / 모달
   ========================================================= */
#scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 90;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
}
#scanlines::after {
  content: ''; position: absolute; left: 0; right: 0; height: 90px; top: -90px;
  background: linear-gradient(transparent, rgba(0,240,255,.05), transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep { to { top: 110%; } }

#alertFrame { position: fixed; inset: 0; pointer-events: none; z-index: 89; opacity: 0; }
body.danger #alertFrame {
  opacity: 1; border: 6px solid var(--red);
  box-shadow: inset 0 0 50px rgba(255,59,78,.55);
  animation: blink .5s steps(2, jump-none) infinite;
}
@keyframes blink { 50% { opacity: .15; } }

#glitch { position: fixed; inset: 0; pointer-events: none; z-index: 95; display: none; mix-blend-mode: screen; }
#glitch.on { display: block; animation: gFlash .38s steps(4) forwards; }
@keyframes gFlash {
  0%   { background: rgba(0,240,255,.25); clip-path: inset(10% 0 70% 0); }
  25%  { background: rgba(255,43,214,.3);  clip-path: inset(50% 0 20% 0); }
  50%  { background: rgba(0,240,255,.2);  clip-path: inset(30% 0 45% 0); }
  75%  { background: rgba(255,43,214,.2);  clip-path: inset(80% 0 5% 0); }
  100% { background: transparent; }
}
body.glitching #app { animation: appGlitch .38s steps(3); }
@keyframes appGlitch {
  0%   { transform: translate(6px,0); filter: hue-rotate(80deg) saturate(2); }
  33%  { transform: translate(-6px,2px); filter: hue-rotate(-60deg); }
  66%  { transform: translate(3px,-2px); filter: invert(.15); }
  100% { transform: none; filter: none; }
}

#toast {
  position: fixed; left: 50%; top: 64px; transform: translateX(-50%) translateY(-20px);
  z-index: 96; padding: 10px 16px; max-width: calc(100% - 32px);
  background: #1a0710; color: var(--red); border: 1px solid var(--red);
  box-shadow: 0 0 20px rgba(255,59,78,.4); opacity: 0; transition: .25s; pointer-events: none;
  font-size: 14px; text-align: center;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.info { background: #04161a; color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,.3); }

#modal {
  position: fixed; inset: 0; z-index: 94; display: none;
  background: rgba(4,4,10,.85); align-items: center; justify-content: center; padding: 16px;
}
#modal.on { display: flex; }
.modal-box {
  width: 100%; max-width: 470px; background: var(--panel); border: 1px solid var(--mag);
  padding: 20px; box-shadow: 0 0 34px rgba(255,43,214,.3);
}
.modal-box h3 { color: var(--mag); margin-bottom: 10px; font-size: 17px; }
.modal-box p { margin-bottom: 16px; white-space: pre-line; }
.modal-box .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-box .row .btn { flex: 1 1 150px; }

/* =========================================================
   HUD
   ========================================================= */
#hud {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 16px; background: rgba(8,8,16,.94);
  border-bottom: 1px solid var(--line); font-size: 13px;
}
#hud .brand { color: var(--cyan); font-weight: bold; letter-spacing: .12em; text-shadow: 0 0 8px rgba(0,240,255,.6); }
#hud .stat { color: var(--dim); white-space: nowrap; }
#hud .stat b { color: var(--text); font-weight: normal; }
#hud .stat b.money { color: var(--yellow); }
#hud .pen { color: var(--red); letter-spacing: 2px; }
#hud .spacer { flex: 1; }
#hud.minimal .stat { display: none; }
#muteBtn {
  background: transparent; border: 1px solid var(--line); color: var(--cyan);
  padding: 4px 10px; cursor: pointer; font-size: 13px; min-height: 32px;
}
#muteBtn:hover { border-color: var(--cyan); }

/* =========================================================
   레이아웃 / 공통
   ========================================================= */
#app { max-width: 980px; margin: 0 auto; padding: 16px 16px 40px; }
.screen { animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
h1, h2, h3 { font-weight: bold; }
.label { color: var(--dim); font-size: 12px; letter-spacing: .15em; margin: 18px 0 8px; }
.label::before { content: '// '; color: var(--mag); }
.hidden { display: none !important; }
.c-cyan { color: var(--cyan); } .c-mag { color: var(--mag); } .c-red { color: var(--red); }
.c-yel { color: var(--yellow); } .c-grn { color: var(--green); } .c-dim { color: var(--dim); }

.btn {
  font: inherit; font-size: 15px; background: transparent; color: var(--cyan);
  border: 1px solid var(--cyan); padding: 11px 16px; min-height: 46px; cursor: pointer;
  letter-spacing: .04em; transition: background .15s, box-shadow .15s, transform .05s;
}
.btn:hover:not(:disabled) { background: rgba(0,240,255,.12); box-shadow: 0 0 14px rgba(0,240,255,.4); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.mag { color: var(--mag); border-color: var(--mag); }
.btn.mag:hover:not(:disabled) { background: rgba(255,43,214,.12); box-shadow: 0 0 14px rgba(255,43,214,.4); }
.btn.red { color: var(--red); border-color: var(--red); }
.btn.red:hover:not(:disabled) { background: rgba(255,59,78,.12); box-shadow: 0 0 14px rgba(255,59,78,.4); }
.btn.yel { color: var(--yellow); border-color: var(--yellow); }
.btn.yel:hover:not(:disabled) { background: rgba(255,210,63,.1); box-shadow: 0 0 14px rgba(255,210,63,.35); }
.btn.solid { background: var(--cyan); color: #001014; font-weight: bold; }
.btn.solid:hover:not(:disabled) { background: #5ff6ff; }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }

.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
.actions {
  position: sticky; bottom: 0; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap;
  padding: 22px 0 calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, transparent, var(--bg) 35%);
}
.actions .btn { flex: 1 1 150px; }

/* 노이즈(깨진 기억) */
.corrupt {
  color: var(--mag); text-shadow: 1px 0 var(--cyan), -1px 0 var(--red);
  animation: jitter .25s steps(2) infinite; display: inline-block;
}
@keyframes jitter { 50% { transform: translate(1px,-1px); opacity: .75; } }

/* 깜빡이는 커서 */
.caret::after { content: '█'; color: var(--cyan); animation: blink 1s steps(2, jump-none) infinite; margin-left: 2px; }
</style>
<style>
/* =========================================================
   타이틀
   ========================================================= */
.title-screen { position: relative; min-height: calc(100dvh - 80px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; }
#rainCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .5; }
.logo {
  position: relative; font-size: clamp(54px, 15vw, 120px); letter-spacing: .18em; color: var(--text);
  text-shadow: 0 0 18px rgba(0,240,255,.7); line-height: 1; padding-left: .18em;
}
.logo::before, .logo::after { content: attr(data-text); position: absolute; inset: 0; padding-left: .18em; }
.logo::before { color: var(--cyan); animation: gl1 2.6s infinite steps(1); }
.logo::after  { color: var(--mag);  animation: gl2 3.1s infinite steps(1); }
@keyframes gl1 { 0%,88%,100% { transform: none; clip-path: inset(0 0 100% 0); } 90% { transform: translate(-5px,0); clip-path: inset(15% 0 55% 0); } 94% { transform: translate(4px,0); clip-path: inset(60% 0 10% 0); } }
@keyframes gl2 { 0%,82%,100% { transform: none; clip-path: inset(0 0 100% 0); } 85% { transform: translate(5px,0); clip-path: inset(40% 0 35% 0); } 91% { transform: translate(-3px,0); clip-path: inset(5% 0 80% 0); } }
.subtitle { color: var(--mag); letter-spacing: .25em; font-size: clamp(14px, 3.6vw, 20px); }
.intro { max-width: 560px; color: var(--dim); font-size: 14px; white-space: pre-line; min-height: 7em; text-align: left; }
.title-screen .btn { min-width: 240px; }
.records { color: var(--dim); font-size: 12px; }

/* =========================================================
   아침 공지
   ========================================================= */
.notice-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 10px 0 6px; }
.notice-head .day { font-size: clamp(34px, 9vw, 54px); color: var(--cyan); text-shadow: 0 0 14px rgba(0,240,255,.6); }
.notice-head .date { color: var(--dim); }
.monologue p { margin: 6px 0; }
.rule-list { list-style: none; display: grid; gap: 8px; }
.rule-list li { padding: 12px 14px; border-left: 3px solid var(--dim); background: var(--panel); }
.rule-list li.new { border-left-color: var(--mag); box-shadow: 0 0 18px rgba(255,43,214,.15); }
.rule-list li .tagline { font-size: 12px; color: var(--mag); margin-bottom: 2px; }
.rule-list li.old .tagline { color: var(--dim); }
.client-preview { color: var(--dim); font-size: 13px; }

/* =========================================================
   시술 화면
   ========================================================= */
.gauge-wrap { position: sticky; top: var(--hud-h, 46px); z-index: 30; background: rgba(10,10,18,.96); padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
.gauge-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 4px; letter-spacing: .08em; }
.gauge-top .pct { color: var(--cyan); }
.gauge { height: 14px; border: 1px solid var(--line); background: #06060c; position: relative; overflow: hidden; }
.gauge .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--mag)); box-shadow: 0 0 12px rgba(0,240,255,.6); }
.gauge::after { content: ''; position: absolute; left: 80%; top: 0; bottom: 0; width: 1px; background: var(--red); }
.gauge.hot .fill { background: var(--red); box-shadow: 0 0 14px var(--red); animation: blink .4s steps(2, jump-none) infinite; }
.gauge-wrap.hot .pct { color: var(--red); }

.client-head { display: flex; gap: 14px; align-items: center; margin: 14px 0 8px; }
.avatar {
  width: 72px; height: 72px; flex: none; display: grid; place-items: center; font-size: 40px;
  border: 1px solid var(--cyan); background: radial-gradient(circle, rgba(0,240,255,.15), transparent 70%);
  box-shadow: 0 0 16px rgba(0,240,255,.25);
}
.client-head h2 { font-size: 22px; color: var(--text); }
.client-head .meta { color: var(--dim); font-size: 13px; }
.dialog { min-height: 4.5em; cursor: pointer; }
.dialog p { margin: 4px 0; }
.dialog p::before { content: '> '; color: var(--mag); }
.request { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--yellow); color: var(--yellow); }
.request::before { content: '▶ 요청: '; color: var(--dim); }
.rules-mini { margin-top: 8px; font-size: 12px; color: var(--dim); }
.rules-mini span { margin-right: 10px; }
.tutorial { margin-top: 8px; padding: 10px 12px; font-size: 13px; color: var(--cyan); background: rgba(0,240,255,.06); border-left: 3px solid var(--cyan); }
#eeg { width: 100%; height: 54px; display: block; margin-top: 12px; border: 1px solid var(--line); background: #05050b; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card {
  position: relative; text-align: left; font: inherit; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); padding: 12px 12px 10px;
  cursor: pointer; min-height: 116px; transition: border-color .15s, box-shadow .15s, background .15s;
}
.card:hover:not(.locked) { border-color: var(--cyan); }
.card .no { color: var(--dim); font-size: 11px; letter-spacing: .15em; margin-bottom: 4px; }
.card .txt { font-size: 14px; }
.card.selected { border-color: var(--mag); background: linear-gradient(160deg, rgba(255,43,214,.12), var(--panel) 60%); box-shadow: 0 0 0 1px var(--mag), 0 0 18px rgba(255,43,214,.3); }
.card.selected::after { content: '삭제 대상'; position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--mag); border: 1px solid var(--mag); padding: 0 5px; transform: rotate(4deg); }
.card.locked { cursor: default; }
.card.erased { opacity: .45; }
.card.erased .txt { text-decoration: line-through; text-decoration-color: var(--mag); }
.card.erased::after { content: '삭제됨'; position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--red); border: 1px solid var(--red); padding: 0 5px; transform: rotate(-4deg); }
.card.fake { border-style: dashed; cursor: default; }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border: 1px solid var(--dim); color: var(--dim); margin: 8px 4px 0 0; }
.tag.forbid { color: var(--red); border-color: var(--red); }
.tag.forbid::after { content: ' ⚠삭제금지'; font-size: 10px; }
.tag.report { color: var(--yellow); border-color: var(--yellow); }
.tag.report::after { content: ' ⚠신고의무'; font-size: 10px; }

.result { margin-top: 14px; }
.result .ln { margin: 4px 0; }

/* =========================================================
   터미널 (결산 / 엔딩)
   ========================================================= */
.term {
  background: #05050b; border: 1px solid var(--line); padding: 16px; font-size: 14px;
  min-height: 260px; box-shadow: inset 0 0 40px rgba(0,240,255,.05); cursor: pointer; overflow-wrap: anywhere;
}
.term .ln { display: block; margin: 2px 0; white-space: pre-wrap; }
.term .ln.h { color: var(--cyan); }
.term .ln.ok { color: var(--green); }
.term .ln.warn { color: var(--yellow); }
.term .ln.bad { color: var(--red); }
.term .ln.mg { color: var(--mag); }
.term .ln.dim { color: var(--dim); }
.term .ln.big { font-size: clamp(22px, 6vw, 34px); color: var(--mag); text-shadow: 0 0 14px rgba(255,43,214,.6); margin: 10px 0; }
.term .ln.quote { color: var(--text); padding-left: 10px; border-left: 2px solid var(--mag); }

/* =========================================================
   밤 화면
   ========================================================= */
.night-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.harin { text-align: center; }
.harin pre { font-family: var(--font); font-size: 13px; line-height: 1.2; color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,.5); display: inline-block; text-align: left; }
.harin .cap { color: var(--dim); font-size: 12px; margin-top: 6px; }
.harin.glitch pre { color: var(--mag); animation: portrait .35s steps(3) infinite; }
@keyframes portrait { 0% { transform: translate(2px,0) skewX(4deg); } 33% { transform: translate(-3px,1px); filter: blur(1px); } 66% { transform: translate(1px,-1px) skewX(-6deg); } }
.state-ok { color: var(--green); } .state-warn { color: var(--yellow); } .state-bad { color: var(--red); animation: blink .8s steps(2, jump-none) infinite; }
.row-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.row-item:last-child { border-bottom: none; }
.row-item .desc { font-size: 12px; color: var(--dim); }
.row-item .price { color: var(--yellow); white-space: nowrap; }
.toggle { min-width: 86px; }
.toggle.on { background: rgba(0,240,255,.15); }
.toggle.off { color: var(--red); border-color: var(--red); }
.mem.sold .mtitle { color: var(--mag); }
.balance { margin-top: 10px; padding: 10px; border: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.balance .neg { color: var(--red); }
.warnline { color: var(--red); font-size: 13px; margin-top: 6px; min-height: 1.4em; }

/* =========================================================
   모바일 (세로)
   ========================================================= */
@media (max-width: 680px) {
  body { font-size: 14px; }
  #hud { gap: 2px 12px; padding: 6px 12px; font-size: 12px; }
  #hud .brand { width: 100%; min-height: 28px; display: flex; align-items: center; }
  #hudLicense, #hud .spacer { display: none; }
  #muteBtn { position: absolute; right: 12px; top: 5px; min-height: 28px; padding: 2px 8px; font-size: 12px; }
  #app { padding: 12px 12px 32px; }
  .night-grid { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr; }
  .card { min-height: 0; }
  .avatar { width: 58px; height: 58px; font-size: 32px; }
  .actions .btn { flex: 1 1 45%; padding: 10px 8px; font-size: 14px; }
  .term { font-size: 13px; padding: 12px; }
}
</style>
