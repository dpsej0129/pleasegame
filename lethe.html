    <ul class="rule-list">
      ${rules.list.map(r => `<li class="${r.day === state.day ? 'new' : 'old'}"><div class="tagline">${r.day === state.day ? '● 신규 규칙' : '○ ' + r.day + '일차부터'}</div><b>${esc(r.title)}</b>${r.day === state.day || rules.list.length < 5 ? `<br><span class="c-dim">${esc(r.text)}</span>` : ''}</li>`).join('')}
      ${Math.abs(mul - 1) > 0.01 ? `<li class="new"><div class="tagline">⚠ 오늘의 경찰 스캔</div>속도 ×${mul.toFixed(2)}${state.scanBoost ? ' · 월세 미납' : ''}${state.memo.maintToday ? ' · 장비 정비' : ''}${state.memo.shakeToday ? ' · 손 떨림' : ''}${state.memo.hotToday || state.flags.hotNow ? ' · 감시 강화' : ''}</li>` : ''}
    </ul>
    <div class="label">예약 손님</div>
    <p class="client-preview">${state.dayClients.map(c => esc(CHARACTERS[c.who].name)).join('  ·  ') || '없음'} — 벌점 ${CONFIG.penaltyLimit}점이면 즉시 면허 박탈</p>
    <div class="actions"><button class="btn solid" id="openBtn" type="button">셔터를 올린다 ▶</button></div>`;
  $('#openBtn').addEventListener('click', () => { Sound.click(); nextClient(); });
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function nextClient() {
  if (state.penalty >= CONFIG.penaltyLimit) { showEnding(ENDINGS.find(e => e.id === 'revoked')); return; }
  if (state.clientIdx < state.dayClients.length) showClient(state.dayClients[state.clientIdx]);
  else showEvening();
}

/* 인터루드: 선택지 없는 장면 */
function showInterlude(id, then) {
  const il = INTERLUDES[id];
  if (!il) { then(); return; }
  transition(() => {
    state.screen = 'interlude';
    app.innerHTML = `
      <section class="screen interlude">
        <div class="scene-head"><span class="t">INTERLUDE <b>·</b> ${esc(il.title)}</span></div>
        ${stageHTML(il.title)}
        ${vnHTML()}
        <div class="actions hidden" id="ilActions"><button class="btn solid" id="ilNext" type="button">▶</button></div>
      </section>`;
    startStage(il.bg, null, il.opts);
    bindVN();
    runScript(il.steps, () => { $('#ilActions').classList.remove('hidden'); $('#ilNext').addEventListener('click', () => { Sound.click(); then(); }); });
  });
}

/* =====================================================================
   10. 화면: 시술 (면담 → 시술 → 결과 → 후속 대화)
   ===================================================================== */
function clientCards(d) { return typeof d.cards === 'function' ? d.cards(state) : (d.cards || []); }

function showClient(data) {
  transition(() => {
    state.screen = 'client';
    state.client = { data, cards: [], selected: new Set(), resolved: false, scan: 0, running: false, lastAlarm: 0, forged: false };
    const name = CHARACTERS[data.who].name;
    app.innerHTML = `
      <section class="screen">
        <div class="gauge-wrap hidden" id="gaugeWrap">
          <div class="gauge-top"><span id="gaugeLabel">🚨 경찰 기억 스캔 ×${scanMultiplier().toFixed(2)}</span><span class="pct" id="gaugePct">0%</span></div>
          <div class="gauge" id="gauge"><div class="fill" id="gaugeFill"></div></div>
        </div>
        <div class="scene-head"><span class="t">DAY ${state.day} <b>·</b> 손님 ${state.clientIdx + 1}/${state.dayClients.length} <b>·</b> ${fx(name)}</span>
          <span class="r">${esc(data.meta || '')}${data.pay ? ` · 보수 <span class="c-yel">${data.pay}₵</span>` : ''}</span></div>
        ${stageHTML(data.type === 'scene' ? '시술소' : data.loc || '시술소 · 면담', data.stageCls)}
        ${vnHTML()}
        <div id="treat" class="hidden"></div>
        <div class="result term hidden" id="result"></div>
        <div class="actions hidden" id="actions"></div>
      </section>`;
    startStage(data.bg || 'clinic', data.who, data.bgOpts);
    bindVN();
    runScript(data.talk || [], () => {
      if (data.type === 'scene') { state.outcomes[data.id] = state.outcomes[data.id] || 'done'; $('#vn').classList.add('hidden'); showNextButton(); }
      else startTreatment();
    });
  });
}

function startTreatment() {
  const c = state.client, data = c.data;
  const rules = activeRules(state.day);
  const isOffer = data.type === 'offer';
  const vipExempt = data.vip && rules.vipProtect;
  c.cards = clientCards(data);
  const tagHtml = t => {
    const cls = data.exempt ? '' : (!vipExempt && rules.forbidTags.includes(t)) ? 'forbid' : rules.reportTags.includes(t) ? 'report' : '';
    return `<span class="tag ${cls}">[${esc(t)}]</span>`;
  };
  setPortrait(data.who);
  $('#vn').classList.add('hidden');
  $('#choices').innerHTML = '';
  if (!data.noGauge) $('#gaugeWrap').classList.remove('hidden');
  const treat = $('#treat');
  treat.classList.remove('hidden');
  treat.innerHTML = `
    <div class="request">${fx(textOf(data.request))}</div>
    <div class="rules-mini">유효 규칙: ${rules.list.filter(r => r.day === state.day || (r.forbidTags || []).concat(r.reportTags || []).some(t => c.cards.some(cd => cd.tags.includes(t)))).map(r => `<span>${r.day}일 ${esc(r.title)}</span>`).join('')}<span class="c-dim">(전체 ${rules.list.length}개)</span>${vipExempt ? '<span class="c-yel">· 임원 VIP</span>' : ''}${rules.registry && !data.exempt ? '<span class="c-mag">· 지운 기억은 보안국에 사본 제출</span>' : ''}</div>
    ${data.tutorial ? `<div class="tutorial">${esc(data.tutorial)}</div>` : ''}
    ${data.noGauge ? '<div class="tutorial" style="border-color:var(--mag);color:var(--mag)">이번 시술은 아무도 지켜보지 않는다. 화면에는 당신의 심박만 남는다.</div>' : ''}
    <div class="label">${esc(data.cardsLabel || '기억 장면 카드')} — ${c.cards.length}개${isOffer ? '' : ' · 지울 장면을 선택'}</div>
    <div class="cards" id="cards">
      ${c.cards.map((cd, i) => `
        <button type="button" class="card ${isOffer || cd.locked ? 'fake locked' : ''}" data-i="${i}">
          <div class="no">SCENE #${String(i + 1).padStart(2, '0')}</div>
          <div class="txt">${fx(textOf(cd.text))}</div>
          <div>${cd.tags.map(tagHtml).join('')}</div>
        </button>`).join('')}
    </div>`;
  const extra = (data.actions || []).filter(a => !a.if || a.if(state));
  const acts = $('#actions');
  acts.classList.remove('hidden');
  acts.innerHTML = isOffer ? `
      <button class="btn mag" id="actMain" type="button">💉 수락 · 이식 실행 (+${data.pay}₵)</button>
      <button class="btn" id="actRefuse" type="button">✋ 거절</button>
      <button class="btn yel" id="actReport" type="button">📡 신고하기</button>` : `
      <button class="btn mag" id="actMain" type="button" disabled>${esc(data.eraseLabel || '⌫ 삭제 실행')} (0)</button>
      ${extra.map((a, i) => `<button class="btn yel" data-extra="${i}" type="button">${esc(a.label)}</button>`).join('')}
      ${rules.registry && !data.exempt ? '<button class="btn" id="actForge" type="button">🗂 빈 사본 제출 (스캔 +25%)</button>' : ''}
      <button class="btn" id="actRefuse" type="button">${esc(textOf(data.refuseLabel) || '✋ 돌려보내기')}</button>
      ${data.noReport ? '' : '<button class="btn yel" id="actReport" type="button">📡 신고하기</button>'}`;

  if (!isOffer) {
    $('#cards').addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card || c.resolved || state.modalOpen || card.classList.contains('locked')) return;
      const i = +card.dataset.i;
      if (c.selected.has(i)) c.selected.delete(i); else c.selected.add(i);
      card.classList.toggle('selected', c.selected.has(i));
      Sound.select();
      const btn = $('#actMain');
      btn.disabled = c.selected.size === 0;
      btn.textContent = `${data.eraseLabel || '⌫ 삭제 실행'} (${c.selected.size})`;
    });
  }
  $('#actMain').addEventListener('click', () => { Sound.click(); resolveClient(isOffer ? 'accept' : 'erase'); });
  $('#actRefuse').addEventListener('click', () => { Sound.click(); resolveClient('refuse'); });
  if ($('#actReport')) $('#actReport').addEventListener('click', () => {
    Sound.click();
    showModal('📡 신고하기', `${CHARACTERS[data.who].name}을(를) 신고합니다.\n손님은 연행되며 보수는 받을 수 없습니다.${isOffer || data.vip ? '' : `\n(신고 포상금 ${CONFIG.reportBounty}₵)`}`, [
      { label: '신고한다', cls: 'yel', onClick: () => resolveClient('report') },
      { label: '취소', cls: '' },
    ]);
  });
  if ($('#actForge')) $('#actForge').addEventListener('click', () => {
    if (c.resolved || c.forged) return;
    c.forged = true; c.scan = Math.min(99, c.scan + 25); renderGauge(); Sound.erase();
    $('#actForge').disabled = true; $('#actForge').textContent = '🗂 빈 사본 준비됨';
    toast('이번 시술의 사본은 빈 파일로 제출된다.', 'info');
  });
  document.querySelectorAll('[data-extra]').forEach(b => b.addEventListener('click', () => {
    const a = extra[+b.dataset.extra];
    if (c.resolved) return;
    a.do(state, c);
    if (a.scan) { c.scan = Math.min(99, c.scan + a.scan); renderGauge(); }
    b.disabled = true;
    if (a.doneLabel) b.textContent = a.doneLabel;
    Sound.erase();
    if (a.note) toast(a.note, 'info');
    if (a.finish) resolveClient(a.finish);
  }));
  treat.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (!data.noGauge) startScan();
}

/* 경찰 스캔 게이지 */
function startScan() {
  const c = state.client;
  if (!c || c.running || c.resolved) return;
  c.running = true;
  state.lastTick = performance.now();
  const rate = (100 / CONFIG.scanSeconds) * scanMultiplier();
  every(() => {
    const now = performance.now();
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    if (!c.running || c.resolved || state.modalOpen) return;
    c.scan = Math.min(100, c.scan + rate * dt);
    renderGauge();
    if (c.scan >= CONFIG.scanDangerPct && now - c.lastAlarm > 900) { c.lastAlarm = now; Sound.alarm(); }
    if (c.scan >= 100) resolveClient('timeout');
  }, 100);
}
function stopScan() { if (state.client) state.client.running = false; document.body.classList.remove('danger'); }
function renderGauge() {
  const c = state.client;
  const fill = $('#gaugeFill');
  if (!fill || !c) return;
  const hot = c.scan >= CONFIG.scanDangerPct;
  fill.style.width = c.scan + '%';
  $('#gaugePct').textContent = Math.floor(c.scan) + '%' + (hot ? ' ⚠ 위험' : '');
  $('#gauge').classList.toggle('hot', hot);
  $('#gaugeWrap').classList.toggle('hot', hot);
  document.body.classList.toggle('danger', hot && c.running && !c.resolved);
}

/* 결과 판정. mode: 'erase' | 'accept' | 'refuse' | 'report' | 'timeout' */
function resolveClient(mode) {
  const c = state.client;
  if (!c || c.resolved) return;
  if (mode === 'erase' && c.selected.size === 0) return;
  c.resolved = true;
  stopScan();
  const d = c.data;
  const name = CHARACTERS[d.who].name;
  const rules = activeRules(state.day);
  const isOffer = d.type === 'offer';
  const vipProtect = d.vip && rules.vipProtect;
  const sel = [...c.selected].map(i => c.cards[i]);
  const r = { mode, outcome: mode, sel, keys: new Set(sel.map(x => x.key).filter(Boolean)), pay: 0, lines: [], penalty: true };
  let wrong = 0;

  document.querySelectorAll('#cards .card').forEach(el => {
    el.classList.add('locked');
    if (mode === 'erase' && c.selected.has(+el.dataset.i)) { el.classList.remove('selected'); el.classList.add('erased'); }
  });

  if (mode === 'report') {
    r.outcome = 'reported';
    if (!vipProtect) { state.totals.reports++; if (!isOffer && !d.noBounty) { r.pay = CONFIG.reportBounty; changeRating(+15); } setPortrait(d.reportWho || 'agent'); }
  } else if (mode === 'timeout') {
    r.outcome = 'timeout'; Sound.fail(); changeRating(-10); setPortrait(null);
  } else if (isOffer) {
    if (mode === 'accept') { r.outcome = 'accepted'; r.pay = d.pay; } else r.outcome = 'refused';
  } else if (mode === 'refuse') {
    r.outcome = 'refused';
  } else {
    Sound.erase();
    const reqTotal = c.cards.filter(x => x.req).length;
    const reqHit = sel.filter(x => x.req).length;
    wrong = sel.filter(x => !x.req).length;
    r.pay = Math.round((d.pay || 0) * (reqTotal ? reqHit / reqTotal : 1) * Math.max(0, 1 - CONFIG.wrongErasePayCut * wrong));
    r.outcome = wrong > 0 ? 'damaged' : reqHit === reqTotal ? 'perfect' : 'partial';
    if (wrong > 0 && !d.exempt) { state.dayLog.damage.push({ name, n: wrong }); state.totals.damage += wrong; changeRating(-5 * wrong); }
    const rec = { client: d.id, day: state.day, tags: [...new Set(sel.flatMap(x => x.tags))], keys: [...r.keys] };
    (state.memo.erasures = state.memo.erasures || []).push(rec);
    if (rules.registry && !c.forged && !d.exempt) state.registered.push(rec);
  }
  if (d.resolve) d.resolve(state, r);
  state.outcomes[d.id] = r.outcome;
  r.lines.unshift({ text: textOf((d.outcomes || {})[r.outcome]) || '', cls: 'quote' });

  // 규칙 판정
  if (!d.exempt && r.penalty) {
    if (mode === 'erase' && !vipProtect) {
      const hit = [...new Set(sel.flatMap(x => x.tags).filter(t => rules.forbidTags.includes(t)))];
      if (hit.length) { addPenalty(`[${hit.join('][')}] 기억 삭제 (${name})`); changeRating(-20); r.lines.push({ text: `⚠ 규칙 위반: [${hit.join('][')}] — 벌점 +1`, cls: 'bad' }); }
    }
    const hasReportTag = c.cards.some(card => card.tags.some(t => rules.reportTags.includes(t)));
    if (hasReportTag && (mode === 'erase' || mode === 'refuse')) { addPenalty(`[${rules.reportTags.join('][')}] 미신고 (${name})`); changeRating(-20); r.lines.push({ text: '⚠ 규칙 위반: 신고 의무 대상 미신고 — 벌점 +1', cls: 'bad' }); }
    if (vipProtect && (mode === 'refuse' || mode === 'report')) { addPenalty(`임원 요청 ${mode === 'refuse' ? '거절' : '신고 시도'}`); changeRating(-20); r.lines.push({ text: '⚠ 감사 규칙 위반 — 벌점 +1', cls: 'bad' }); }
  }
  if (mode === 'timeout') { addPenalty(`경찰 스캔 적발 (${name})`); r.lines.push({ text: '⚠ 경찰 스캔 적발. 시술 실패 — 벌점 +1', cls: 'bad' }); }
  if (wrong > 0 && !d.exempt) r.lines.push({ text: `인격 손상 ${wrong}건 — 보수 ${Math.round(CONFIG.wrongErasePayCut * 100 * wrong)}% 삭감`, cls: 'warn' });
  if (r.pay > 0) {
    const label = mode === 'report' ? `${name} 신고 포상금` : `${name} 시술비`;
    addIncome(label, r.pay);
    r.lines.push({ text: `+${r.pay}₵ 입금 (${label})`, cls: 'ok' });
  } else if (!d.exempt) r.lines.push({ text: '수입 없음.', cls: 'dim' });
  updateHUD();

  $('#actions').innerHTML = '';
  const box = $('#result');
  box.classList.remove('hidden');
  box.innerHTML = '';
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  typeLines(box, r.lines, () => {
    const steps = d.after ? d.after(state, r) : null;
    if (steps && steps.length) {
      const vn = $('#vn');
      vn.classList.remove('hidden');
      box.after(vn); vn.after($('#choices'));
      vn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      runScript(steps, () => { vn.classList.add('hidden'); showNextButton(); });
    } else showNextButton();
  }, { speed: 14, gap: 240 });
}

function showNextButton() {
  const last = state.penalty >= CONFIG.penaltyLimit;
  const isLastClient = state.clientIdx >= state.dayClients.length - 1;
  const acts = $('#actions');
  acts.classList.remove('hidden');
  acts.innerHTML = `<button class="btn ${last ? 'red' : 'solid'}" id="nextBtn" type="button">${last ? '⚠ 면허 관리국 통보 수신' : isLastClient ? '셔터를 내린다 (저녁) ▶' : '다음 손님 ▶'}</button>`;
  $('#nextBtn').addEventListener('click', () => { Sound.click(); state.clientIdx++; nextClient(); });
}

/* =====================================================================
   11. 저녁: 장소 선택 → 사이드 퀘스트 → (조용한 장면) → 밤
   ===================================================================== */
function eveningSteps(loc) {
  const ev = ((DAYS[state.day] || {}).evening || {})[loc.id];
  const story = typeof ev === 'function' ? ev(state) : ev;
  return { story: !!(story && story.length), steps: story && story.length ? story : EVENING_DEFAULT[loc.id](state) };
}
function locBadge(loc) {
  if (eveningSteps(loc).story) return '<span class="badge">★ 이야기</span>';
  if (loc.id === 'clinic' && selfScanReady()) return '<span class="badge key">잠긴 기억</span>';
  return '';
}
function selfScanReady() { return state.day >= 5 && !state.clues.includes('trace') && state.clues.length >= 2; }

function showEvening() {
  const D = DAYS[state.day] || {};
  if (D.finale) { playScene(`DAY ${state.day} · 마지막 저녁`, D.finale.bg, D.finale.steps, showNight, '마지막 밤 ▶'); return; }
  transition(() => {
    state.screen = 'evening';
    app.innerHTML = `
      <section class="screen">
        <div class="scene-head"><span class="t">DAY ${state.day} <b>·</b> 저녁</span><span class="r">오늘 밤 갈 수 있는 곳은 한 군데뿐이다</span></div>
        <div class="monologue" id="eveMono"></div>
        <div class="label">어디로 갈까?</div>
        <div class="loc-grid">
          ${LOCATIONS.map(l => `<button type="button" class="loc-card" data-loc="${l.id}"><canvas width="${BW}" height="${BH}"></canvas>${locBadge(l)}
            <div class="info"><div class="nm">${esc(l.name)}</div><div class="ds">${esc(l.desc)}</div></div></button>`).join('')}
        </div>
        <div class="label">하린 사건 단서 (${state.clues.length}/${Object.keys(CLUES).length}) · 진실 단계 ${truthLevel()}</div>
        ${state.clues.length ? `<ul class="clue-list">${state.clues.map(id => `<li>${fx(CLUES[id].text)}</li>`).join('')}</ul>` : '<p class="c-dim" style="font-size:13px">아직 아무것도 모른다. 하린은 왜 잠들어 있을까.</p>'}
      </section>`;
    typeLines($('#eveMono'), [(D.eveningLine && textOf(D.eveningLine)) || '셔터를 내리자 골목의 네온이 하나둘 켜진다.'], null, { speed: 16 });
    document.querySelectorAll('.loc-card').forEach(btn => {
      const loc = LOCATIONS.find(l => l.id === btn.dataset.loc);
      drawBackground(btn.querySelector('canvas').getContext('2d'), loc.bg, 1.7, {});
      btn.addEventListener('click', () => { Sound.click(); goLocation(loc); });
    });
  });
}
function goLocation(loc) {
  const { steps } = eveningSteps(loc);
  state.visits[loc.id] = (state.visits[loc.id] || 0) + 1;
  state.dayLog.events.push(`저녁: ${loc.name}`);
  state.memo.lastLoc = loc.id;
  playScene(`DAY ${state.day} · 저녁 · ${loc.name}`, loc.bg, steps, afterEvening, '돌아간다 ▶');
}
function afterEvening() {
  const q = (DAYS[state.day] || {}).quiet;
  if (q && (!q.cond || q.cond(state))) playScene(`조용한 장면 · ${q.title}`, q.bg, q.steps, showNight, '▶', q.opts);
  else showNight();
}

function playScene(title, bg, steps, then, label, opts) {
  transition(() => {
    state.screen = 'scene';
    app.innerHTML = `
      <section class="screen">
        <div class="scene-head"><span class="t">${esc(title)}</span></div>
        ${stageHTML(title.split('·').pop().trim())}
        ${vnHTML()}
        <div class="actions hidden" id="sceneActions"><button class="btn solid" id="sceneNext" type="button">${esc(label)}</button></div>
      </section>`;
    startStage(bg, null, opts);
    bindVN();
    runScript(steps, () => {
      $('#sceneActions').classList.remove('hidden');
      $('#choices').innerHTML = '';
      $('#sceneNext').addEventListener('click', () => { Sound.click(); then(); });
    });
  });
}

/* =====================================================================
   12. 밤: 지출 · 기억 판매 · 녹음기
   ===================================================================== */
function showNight() {
  state.nightPay = { rent: true, life: true };
  transition(() => {
    state.screen = 'night';
    const st = HARIN_STATES[state.harin];
    app.innerHTML = `
      <section class="screen">
        <div class="scene-head"><span class="t" style="color:var(--mag)">NIGHT ${state.day} <b>·</b> 2층 단칸방</span><span class="r">${state.day}/${CONFIG.totalDays}일째 밤</span></div>
        ${stageHTML('2층 단칸방 · 원격 바이탈 모니터', 'short')}
        <div class="monologue" id="nightMono" style="margin:10px 0"></div>
        <div class="night-grid">
          <div class="monitor ${isLost(4) ? 'glitch' : ''}" id="harinBox">
            <canvas id="harinCv" width="${PW}" height="${PH}"></canvas>
            <div class="cap">한하린 · 17세 · 코마 ${412 + state.day}일째</div>
            <div>상태: <b class="${st.cls}">${st.label}</b></div>
            <div class="cap">${esc(st.cap)}</div>
            <div class="cap c-mag" id="harinNote">${isLost(4) ? fx('이 아이의 웃는 얼굴이 떠오르지 않는다.') : ''}</div>
            <button class="btn small" id="recBtn" type="button" style="margin-top:8px">📼 노란 녹음기 (${(state.memo.voices || []).length})</button>
          </div>
          <div class="panel">
            <div class="label" style="margin-top:0">오늘 밤 지출</div>
            <div id="expenseList"></div>
            <div class="balance" id="balance"></div>
            <div class="warnline" id="nightWarn"></div>
          </div>
        </div>
        <div class="label">내 기억 — 판 기억도, 준 기억도 영영 돌아오지 않는다</div>
        <div class="panel" id="memList"></div>
        <div class="actions"><button class="btn solid" id="sleepBtn" type="button">지출 확정 · 밤을 보낸다 ▶</button></div>
      </section>`;
    startStage('room', null, { critical: state.harin >= 2, photoGlitch: isLost(4) });
    const nt = (DAYS[state.day] || {}).night;
    typeLines($('#nightMono'), (nt && textOf(nt)) || ['셔터를 내린다. 모니터에 하린의 바이탈이 흐른다.'], null, { speed: 18 });
    const hctx = $('#harinCv').getContext('2d');
    const drawHarin = () => drawPortrait(hctx, 'harin', { glitch: portraitGlitch('harin') });
    drawHarin();
    every(() => { if (isLost(4)) drawHarin(); }, 140);
    $('#recBtn').addEventListener('click', () => { Sound.click(); openRecorder(state.memo.voices || []); });
    renderNightPanels();
    $('#sleepBtn').addEventListener('click', confirmNight);
  });
}
function nightTotal() { return EXPENSES.reduce((sum, e) => sum + (state.nightPay[e.id] ? e.cost(state) : 0), 0); }

function renderNightPanels() {
  $('#expenseList').innerHTML = EXPENSES.map(e => `
    <div class="row-item">
      <div><div>${esc(e.name)} <span class="price">${e.cost(state)}₵</span></div><div class="desc">${esc(e.desc)}</div></div>
      <button type="button" class="btn small toggle ${state.nightPay[e.id] ? 'on' : 'off'}" data-exp="${e.id}">${state.nightPay[e.id] ? '✔ 지불' : '✖ 미지불'}</button>
    </div>`).join('');
  $('#expenseList').querySelectorAll('[data-exp]').forEach(b => b.addEventListener('click', () => {
    Sound.click(); state.nightPay[b.dataset.exp] = !state.nightPay[b.dataset.exp]; renderNightPanels();
  }));
  const total = nightTotal(), after = state.money - total;
  $('#balance').innerHTML = `<span>잔액 <b class="c-yel">${state.money}₵</b></span><span>지출 <b>-${total}₵</b></span><span>남는 돈 <b class="${after < 0 ? 'neg' : 'c-grn'}">${after}₵</b></span>`;
  $('#nightWarn').textContent = after < 0 ? `잔액이 ${-after}₵ 부족하다. 지불 항목을 줄이거나 내 기억을 팔아야 한다.` : '';
  $('#sleepBtn').disabled = after < 0;
  $('#memList').innerHTML = MY_MEMORIES.map(m => {
    const sold = state.sold.includes(m.id), given = state.donated.includes(m.id);
    return `
      <div class="row-item mem ${sold || given ? 'sold' : ''}">
        <div><span class="c-dim">${m.mark}</span> <span class="mtitle">${sold || given ? `<span class="corrupt">${noise(m.title.length)}</span>` : fx(m.title)}</span>
          <div class="desc">${sold ? '판매됨 — 데이터 없음' : given ? `기증함 — ${esc((state.memo.donatedTo || {})[m.id] || '')}` : '감정가 ' + m.price + '₵'}</div></div>
        ${sold || given ? '<span class="c-dim">░░░</span>' : `<button type="button" class="btn small mag" data-mem="${m.id}">판매 +${m.price}₵</button>`}
      </div>`;
  }).join('');
  $('#memList').querySelectorAll('[data-mem]').forEach(b => b.addEventListener('click', () => {
    Sound.click();
    const m = memById(+b.dataset.mem);
    showModal(`${m.mark} 기억 판매`, `「${m.title}」\n\n${m.price}₵에 판매합니다.\n판 기억은 영원히 사라지며, 관련된 단어는 읽을 수 없게 됩니다.\n하린의 의식 속에서도 그 자리는 비게 됩니다.`, [
      { label: `판다 (+${m.price}₵)`, cls: 'mag', onClick: () => sellMemory(m) },
      { label: '그만둔다', cls: '' },
    ]);
  }));
  updateHUD();
}

function sellMemory(m) {
  if (isLost(m.id)) return;
  state.sold.push(m.id);
  state.money += m.price;
  state.totals.sales += m.price;
  state.dayLog.sales.push({ label: m.title, amount: m.price });
  Sound.erase(); later(() => Sound.glitch(), 450); flashGlitch();
  if (m.glitchPortrait) { $('#harinBox').classList.add('glitch'); $('#harinNote').innerHTML = fx('이 아이의 웃는 얼굴이 떠오르지 않는다.'); Stage.opts.photoGlitch = true; }
  const mono = $('#nightMono');
  if (mono) mono.innerHTML = [].concat(textOf((DAYS[state.day] || {}).night) || []).map(t => `<p class="ln">${fx(t)}</p>`).join('');
  renderNightPanels();
  if (m.fake) {
    addClue('fake');
    showModal('기억 감정 결과', '중개인이 추출한 기억을 들여다보다 혀를 찬다.\n\n"이거 이식된 기억이네. 가짜야. 접합 흔적이… 이상하네, 시술자 번호가 본인이야."\n\n내 첫 시술은… 가짜였다.', [{ label: '…', cls: 'mag' }]);
  } else toast(`${m.mark} 기억이 추출되었다. 무언가가 빠져나갔다.`, 'info');
}

function openRecorder(list) {
  const ids = [...list].sort((a, b) => a - b);
  const body = Object.keys(VOICE).map(n => ids.includes(+n) ? `▶ ${n}. "${VOICE[n]}"` : `▷ ${n}. ${noise(18)}`).join('\n\n');
  showModal('📼 노란 녹음기', ids.length ? body : '재생할 메시지가 없다. 고장 난 줄 알았던 녹음기다.', [{ label: '닫는다', cls: '' }]);
  if (ids.length) { for (let i = 0; i < 6; i++) Sound.tone(300 + Math.random() * 300, 0.05, 'triangle', 0.02, 0, i * 0.09); }
}

function confirmNight() {
  const total = nightTotal();
  if (state.money < total) return;
  Sound.click();
  state.money -= total;
  state.totals.expense += total;
  EXPENSES.forEach(e => state.dayLog.expense.push({ label: e.name, amount: e.cost(state), paid: !!state.nightPay[e.id] }));
  if (!state.nightPay.life) {
    state.harin = Math.min(3, state.harin + 1);
    state.dayLog.events.push(`생명유지 비용 미납 — 하린 상태: ${HARIN_STATES[state.harin].label}`);
  }
  state.scanBoost = !state.nightPay.rent;
  if (!state.nightPay.rent) {
    state.rentMissed++;
    changeRating(-10);
    state.dayLog.events.push(`월세 미납 (누적 ${state.rentMissed}회) — 내일 경찰 스캔 가속`);
    if (state.rentMissed === CONFIG.rentPenaltyAfter) addPenalty('월세 누적 체납 — 건물주의 신고');
  }
  const dv = (DAYS[state.day] || {}).dive;
  if (dv && state.harin < 3) showDive(dv, showSettlement);
  else showSettlement();
}

/* =====================================================================
   13. 하린 다이브: 판 기억은 회색 노이즈 공간이 된다
   ===================================================================== */
function showDive(n, then) {
  const dv = DIVES[n];
  if (!dv) { then(); return; }
  transition(() => {
    state.screen = 'dive';
    app.innerHTML = `
      <section class="screen dive">
        <div class="scene-head"><span class="t" style="color:#b48aff">DIVE ${n} <b>·</b> ${esc(dv.title)}</span><span class="r">공명도 <b id="resoVal">${state.resonance}</b></span></div>
        ${stageHTML('하린의 의식 속')}
        ${vnHTML()}
        <div class="room-list hidden" id="rooms"></div>
        <div class="actions hidden" id="diveActions"><button class="btn solid" id="diveNext" type="button">떠오른다 ▶</button></div>
      </section>`;
    startStage(dv.bg, 'harinDream', { dream: true });
    bindVN();
    const critical = state.harin >= 2;
    const rooms = dv.rooms.filter(r => !r.need || r.need(state)).slice(0, critical ? 1 : 99);
    const visited = new Set();
    const finish = () => runScript(dv.end || [], () => { $('#diveActions').classList.remove('hidden'); $('#diveNext').addEventListener('click', () => { Sound.click(); then(); }); });
    const renderRooms = () => {
      $('#vn').classList.add('hidden');
      const box = $('#rooms');
      box.classList.remove('hidden');
      box.innerHTML = rooms.map((r, i) => {
        const lost = r.mem && isLost(r.mem);
        return `<button type="button" class="room ${visited.has(i) ? 'done' : ''} ${lost ? 'lost' : ''}" data-room="${i}" ${visited.has(i) ? 'disabled' : ''}>
          <span class="rn">${lost ? noise(r.name.length + 2) : esc(r.name)}</span><span class="rd">${visited.has(i) ? '…' : lost ? '여기, 뭔가 있었다' : esc(r.hint || '')}</span></button>`;
      }).join('') + (visited.size === rooms.length ? '' : '<div class="c-dim" style="font-size:12px;margin-top:6px">하린의 실루엣이 앞서 걷는다. 기억의 방을 하나씩 지나간다.</div>');
      box.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => enterRoom(+b.dataset.room)));
      if (visited.size === rooms.length) { box.classList.add('hidden'); $('#vn').classList.remove('hidden'); finish(); }
    };
    const enterRoom = i => {
      const r = rooms[i];
      visited.add(i);
      $('#rooms').classList.add('hidden');
      $('#vn').classList.remove('hidden');
      const lost = r.mem && isLost(r.mem);
      setBg(r.bg, lost ? { static: 0.85, dream: true } : { dream: true });
      setPortrait('harinDream');
      const key = `${n}-${r.id}`;
      const steps = lost ? [N(`${r.name}. …였던 곳. 회색 잡음만 가득하다.`), N('하린의 실루엣이 그 앞에서 멈춰 선다. 돌아보지 않는다.'), T('harinDream', '여기… 뭐가 있었는데.'),
        ...(r.lostSteps || [])] : r.steps;
      runScript(steps, () => {
        if (!lost && !state.diveSeen.includes(key)) { state.diveSeen.push(key); state.resonance += (r.reso === undefined ? 1 : textOf(r.reso)); $('#resoVal').textContent = state.resonance; Sound.coin(); }
        setBg(dv.bg, { dream: true });
        renderRooms();
      });
    };
    runScript(critical ? [N('하린의 의식이 어둡다. 경고음이 다이브 장비를 타고 들려온다. 오래 머물 수 없다.'), ...(dv.intro || [])] : (dv.intro || []), renderRooms);
  });
}

/* =====================================================================
   14. 결산: 터미널 로그 + 1인칭 일기 + 미오의 그림
   ===================================================================== */
function diaryStyle(lines, lv) {
  return lines.map((t, i) => {
    if (lv >= 2 && i % 2 === 1) t = t.replace(/[.!?]?$/, '—');
    if (lv >= 3 && i === lines.length - 1) t = t + ' ' + t + ' ' + t.slice(0, 8) + '…';
    return t;
  });
}
function showSettlement() {
  transition(() => {
    state.screen = 'settle';
    const L = state.dayLog;
    const sum = arr => arr.reduce((s, x) => s + x.amount, 0);
    const paid = L.expense.filter(e => e.paid);
    const diary = diaryStyle([].concat(((DAYS[state.day] || {}).diary || (() => []))(state)), truthLevel());
    const remain = MY_MEMORIES.filter(m => !isLost(m.id));
    const recall = remain.length ? remain[(Math.random() * remain.length) | 0] : null;
    const lines = [
      { text: `> LETHE://ledger --day ${state.day}`, cls: 'h' },
      { text: ' ' },
      { text: `[수입]  +${sum(L.income)}₵`, cls: 'ok' },
      ...L.income.map(x => ({ text: `   · ${x.label} +${x.amount}₵`, cls: 'dim' })),
      ...(L.sales.length ? [{ text: `[기억 판매]  +${sum(L.sales)}₵`, cls: 'mg' }, ...L.sales.map(x => ({ text: `   · ${noise(x.label.length)} +${x.amount}₵`, cls: 'mg' }))] : []),
      { text: `[지출]  -${sum(paid) + sum(L.spend)}₵`, cls: 'warn' },
      ...L.expense.map(x => ({ text: `   · ${x.label} ${x.paid ? '-' + x.amount + '₵' : '미지불'}`, cls: x.paid ? 'dim' : 'bad' })),
      ...L.spend.map(x => ({ text: `   · ${x.label} -${x.amount}₵`, cls: 'dim' })),
      { text: `[잔액]  ${state.money}₵   [벌점]  ${state.penalty}/${CONFIG.penaltyLimit}   [기업 평가]  ${ratingGrade(state.rating)}`, cls: 'h' },
      ...L.penalties.map(p => ({ text: `   · 벌점: ${p}`, cls: 'bad' })),
      ...(L.damage.length ? [{ text: `[인격 손상]  ${L.damage.map(x => `${x.name} ${x.n}건`).join(', ')}`, cls: 'warn' }] : []),
      { text: `[하린]  ${HARIN_STATES[state.harin].label}   [단서]  ${state.clues.length}/${Object.keys(CLUES).length}   [잃은 기억]  ${lostCount()}/${MY_MEMORIES.length}`, cls: ['ok', 'warn', 'bad', 'bad'][state.harin] },
      ...L.events.map(e => ({ text: `   · ${e}`, cls: 'warn' })),
      { text: ' ' },
      { text: `[서진의 일기 — ${state.day}일째 밤]`, cls: 'h' },
      ...diary.map(t => ({ text: t, cls: 'quote' })),
      ...(recall ? [{ text: `(${recall.mark} ${recall.diary})`, cls: 'dim' }] : [{ text: noise(30), cls: 'mg' }]),
      { text: ' ' },
      { text: '> EOF', cls: 'dim' },
    ];
    const isLast = state.day >= CONFIG.totalDays;
    const dead = state.harin >= 3;
    const revoked = state.penalty >= CONFIG.penaltyLimit;
    const drawings = [...state.drawings, ...(state.flags.mioBetrayed ? ['torn'] : [])];
    app.innerHTML = `
      <section class="screen">
        <div class="label">DAY ${state.day} 결산 — 화면을 누르면 로그를 건너뜁니다</div>
        <div class="term" id="term"></div>
        ${drawings.length ? `<div class="label">미오의 그림 (${state.drawings.length})</div><div class="drawings">${drawings.map(id => `<figure><canvas width="32" height="24" data-draw="${id}"></canvas><figcaption>${esc(DRAWINGS[id].title)}</figcaption></figure>`).join('')}</div>` : ''}
        <div class="actions hidden" id="settleActions">
          <button class="btn ${revoked || dead ? 'red' : 'solid'}" id="goBtn" type="button">${revoked ? '⚠ 면허 관리국 통보 수신' : dead ? '…' : isLast ? '마지막 기록 열람 ▶' : `DAY ${state.day + 1} ▶`}</button>
        </div>
      </section>`;
    document.querySelectorAll('[data-draw]').forEach(cv => renderDrawing(cv, cv.dataset.draw));
    typeLines($('#term'), lines, () => $('#settleActions').classList.remove('hidden'), { tag: 'span', speed: 6, chunk: 2, gap: 50 });
    $('#goBtn').addEventListener('click', () => {
      Sound.click();
      if (revoked) { showEnding(ENDINGS.find(e => e.id === 'revoked')); return; }
      if (dead) { showEnding(ENDINGS.find(e => e.id === 'loss')); return; }
      if (isLast) { showEnding(judgeEnding()); return; }
      const il = (DAYS[state.day] || {}).interlude;
      const next = () => { state.day++; startDay(); };
      if (il) showInterlude(il, next); else next();
    });
  });
}

/* =====================================================================
   15. 엔딩 · 에필로그 슬라이드 · 갤러리 · 그림첩
   ===================================================================== */
function judgeEnding() { return ENDINGS.find(e => e.cond(state)); }

function showEnding(ending) {
  transition(() => {
    state.screen = 'ending';
    state.memo.ending = ending.id;
    saveRecord(ending.id);
    clearSave();
    const rec = loadRecords();
    const extra = ending.extra ? ending.extra(state) : [];
    const lines = [
      { text: '> LETHE://archive --final', cls: 'h' },
      { text: `${ending.tag} // ${ending.title}`, cls: 'big', pause: 700 },
      ...textOf(ending.lines).map(t => ({ text: t, cls: t.startsWith('>') ? 'bad' : 'quote', pause: 700 })),
      ...extra.map(t => ({ text: t, cls: 'quote', pause: 700 })),
      { text: ' ' },
      { text: `   잔액 ${state.money}₵ · 벌점 ${state.penalty}/${CONFIG.penaltyLimit} · 하린 ${HARIN_STATES[state.harin].label} · 단서 ${state.clues.length}/${Object.keys(CLUES).length} · 공명도 ${state.resonance}`, cls: 'dim' },
      { text: `   잃은 기억 ${lostCount()}/${MY_MEMORIES.length} (판매 ${state.sold.length} · 기증 ${state.donated.length}) · 미오의 그림 ${state.drawings.length}장`, cls: 'dim' },
      { text: `   엔딩 수집 ${rec.length}/${ENDINGS.length}`, cls: 'dim' },
    ];
    app.innerHTML = `
      <section class="screen">
        <div class="scene-head"><span class="t">FINAL LOG <b>·</b> ${esc(ending.title)}</span><span class="r">화면을 누르면 건너뜁니다</span></div>
        <div class="end-art">${stageHTML(ending.tag)}</div>
        <div class="term" id="term"></div>
        <div class="actions hidden" id="endActions">
          <button class="btn solid" id="epiBtn" type="button">후일담 ▶</button>
          <button class="btn" id="titleBtn" type="button">타이틀로</button>
        </div>
      </section>`;
    startStage(textOf(ending.bg), textOf(ending.who), textOf(ending.bgOpts) || {});
    if (ending.tag.includes('BAD')) Sound.fail();
    typeLines($('#term'), lines, () => $('#endActions').classList.remove('hidden'), { tag: 'span', speed: 24, gap: 140 });
    $('#epiBtn').addEventListener('click', () => { Sound.click(); showEpilogue(ending, 0); });
    $('#titleBtn').addEventListener('click', () => { Sound.click(); showTitle(); });
  });
}

function showEpilogue(ending, i) {
  const slides = EPILOGUE.filter(sl => !sl.cond || sl.cond(state, ending.id));
  if (i >= slides.length) { showTitle(); return; }
  const sl = slides[i];
  transition(() => {
    state.screen = 'epilogue';
    app.innerHTML = `
      <section class="screen epilogue">
        <div class="scene-head"><span class="t">EPILOGUE <b>·</b> ${i + 1}/${slides.length}</span><span class="r">${esc(textOf(sl.title) || '')}</span></div>
        ${stageHTML(textOf(sl.title))}
        <div class="vn"><div class="vn-text" id="epiText"></div></div>
        <div class="actions"><button class="btn solid" id="epiNext" type="button">${i + 1 < slides.length ? '다음 ▶' : '끝 — 타이틀로'}</button></div>
      </section>`;
    startStage(sl.bg(state, ending.id), sl.who(state, ending.id), (sl.opts && sl.opts(state, ending.id)) || {});
    typeLines($('#epiText'), [].concat(sl.text(state, ending.id)), null, { speed: 22, gap: 300 });
    $('#epiNext').addEventListener('click', () => { Sound.click(); showEpilogue(ending, i + 1); });
  });
}

function miniStage(cv, bg, who, opts) {
  const c = cv.getContext('2d');
  drawBackground(c, bg, 2.2, opts || {});
  if (who) {
    const p = document.createElement('canvas'); p.width = PW; p.height = PH;
    drawPortrait(p.getContext('2d'), who, { tint: CHARACTERS[who].tint });
    c.drawImage(p, (BW - PW * 2.3) / 2, BH - PH * 2.3, PW * 2.3, PH * 2.3);
  }
}
function showGallery() {
  transition(() => {
    state.screen = 'gallery';
    const rec = loadRecords();
    app.innerHTML = `
      <section class="screen">
        <div class="scene-head"><span class="t">엔딩 갤러리 <b>·</b> ${rec.length}/${ENDINGS.length}</span></div>
        <div class="gallery">${ENDINGS.map(e => `<figure class="${rec.includes(e.id) ? '' : 'locked'}"><canvas width="${BW}" height="${BH}" data-end="${e.id}"></canvas>
          <figcaption><b>${rec.includes(e.id) ? esc(e.title) : '???'}</b><span>${rec.includes(e.id) ? esc(e.tag) : noise(8)}</span>${rec.includes(e.id) && e.hint ? `<small>${esc(e.hint)}</small>` : ''}</figcaption></figure>`).join('')}</div>
        <div class="actions"><button class="btn" id="backBtn" type="button">← 타이틀</button></div>
      </section>`;
    document.querySelectorAll('[data-end]').forEach(cv => {
      const e = ENDINGS.find(x => x.id === cv.dataset.end);
      if (rec.includes(e.id)) { const fake = Object.assign({}, state, { flags: {}, sold: [], donated: [] }); miniStage(cv, typeof e.bg === 'function' ? e.bg(fake) : e.bg, typeof e.who === 'function' ? e.who(fake) : e.who, typeof e.bgOpts === 'function' ? {} : e.bgOpts); }
      else miniStage(cv, 'static', null, {});
    });
    $('#backBtn').addEventListener('click', () => { Sound.click(); showTitle(); });
  });
}
function showDrawings() {
  transition(() => {
    state.screen = 'drawings';
    app.innerHTML = `
      <section class="screen">
        <div class="scene-head"><span class="t">미오의 그림첩 <b>·</b> ${META.drawings.length}/${Object.keys(DRAWINGS).length - 1}</span></div>
        <div class="drawings big">${Object.keys(DRAWINGS).filter(id => id !== 'torn').map(id => `<figure><canvas width="32" height="24" data-draw="${META.drawings.includes(id) ? id : ''}"></canvas><figcaption>${META.drawings.includes(id) ? esc(DRAWINGS[id].title) : '???'}</figcaption></figure>`).join('')}</div>
        <div class="actions"><button class="btn" id="backBtn" type="button">← 타이틀</button></div>
      </section>`;
    document.querySelectorAll('[data-draw]').forEach(cv => { if (cv.dataset.draw) renderDrawing(cv, cv.dataset.draw); else { const c = cv.getContext('2d'); c.fillStyle = '#222'; c.fillRect(0, 0, 32, 24); } });
    $('#backBtn').addEventListener('click', () => { Sound.click(); showTitle(); });
  });
}

/* =====================================================================
   16. 초기화
   ===================================================================== */
$('#muteBtn').addEventListener('click', () => { state.muted = !state.muted; Sound.init(); if (!state.muted) Sound.click(); updateHUD(); });
document.addEventListener('pointerdown', () => Sound.init(), { once: true });
window.LETHE = { state, CLIENTS, ENDINGS, DAYS, META };
resetState();
showTitle();
</script>
</body>
</html>
