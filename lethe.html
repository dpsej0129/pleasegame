<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LETHE // 기억 삭제 클리닉</title>
<style>
/* =========================================================
   테마 변수
   ========================================================= */
:root {
  --bg: #0a0a12;
  --panel: #10101c;
  --panel2: #161627;
  --line: #2a2a48;
  --cyan: #00f0ff;
  --mag: #ff2bd6;
  --red: #ff3b4e;
  --yellow: #ffd23f;
  --green: #39ff9f;
  --text: #d8f4ff;
  --dim: #7a86a6;
  --font: 'D2Coding', 'Nanum Gothic Coding', 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font); }
body {
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden; line-height: 1.6; font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }

/* =========================================================
   오버레이: 스캔라인 / 경고 테두리 / 글리치 / 토스트 / 모달
   ========================================================= */
#scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 90;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
}
#scanlines::after {
  content: ''; position: absolute; left: 0; right: 0; height: 90px; top: -90px;
  background: linear-gradient(transparent, rgba(0,240,255,.05), transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep { to { top: 110%; } }

#alertFrame { position: fixed; inset: 0; pointer-events: none; z-index: 89; opacity: 0; }
body.danger #alertFrame {
  opacity: 1; border: 6px solid var(--red);
  box-shadow: inset 0 0 50px rgba(255,59,78,.55);
  animation: blink .5s steps(2, jump-none) infinite;
}
@keyframes blink { 50% { opacity: .15; } }

#glitch { position: fixed; inset: 0; pointer-events: none; z-index: 95; display: none; mix-blend-mode: screen; }
#glitch.on { display: block; animation: gFlash .38s steps(4) forwards; }
@keyframes gFlash {
  0%   { background: rgba(0,240,255,.25); clip-path: inset(10% 0 70% 0); }
  25%  { background: rgba(255,43,214,.3);  clip-path: inset(50% 0 20% 0); }
  50%  { background: rgba(0,240,255,.2);  clip-path: inset(30% 0 45% 0); }
  75%  { background: rgba(255,43,214,.2);  clip-path: inset(80% 0 5% 0); }
  100% { background: transparent; }
}
body.glitching #app { animation: appGlitch .38s steps(3); }
@keyframes appGlitch {
  0%   { transform: translate(6px,0); filter: hue-rotate(80deg) saturate(2); }
  33%  { transform: translate(-6px,2px); filter: hue-rotate(-60deg); }
  66%  { transform: translate(3px,-2px); filter: invert(.15); }
  100% { transform: none; filter: none; }
}

#toast {
  position: fixed; left: 50%; top: 64px; transform: translateX(-50%) translateY(-20px);
  z-index: 96; padding: 10px 16px; max-width: calc(100% - 32px);
  background: #1a0710; color: var(--red); border: 1px solid var(--red);
  box-shadow: 0 0 20px rgba(255,59,78,.4); opacity: 0; transition: .25s; pointer-events: none;
  font-size: 14px; text-align: center;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.info { background: #04161a; color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,.3); }

#modal {
  position: fixed; inset: 0; z-index: 94; display: none;
  background: rgba(4,4,10,.85); align-items: center; justify-content: center; padding: 16px;
}
#modal.on { display: flex; }
.modal-box {
  width: 100%; max-width: 470px; background: var(--panel); border: 1px solid var(--mag);
  padding: 20px; box-shadow: 0 0 34px rgba(255,43,214,.3);
}
.modal-box h3 { color: var(--mag); margin-bottom: 10px; font-size: 17px; }
.modal-box p { margin-bottom: 16px; white-space: pre-line; }
.modal-box .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-box .row .btn { flex: 1 1 150px; }

/* =========================================================
   HUD
   ========================================================= */
#hud {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 16px; background: rgba(8,8,16,.94);
  border-bottom: 1px solid var(--line); font-size: 13px;
}
#hud .brand { color: var(--cyan); font-weight: bold; letter-spacing: .12em; text-shadow: 0 0 8px rgba(0,240,255,.6); }
#hud .stat { color: var(--dim); white-space: nowrap; }
#hud .stat b { color: var(--text); font-weight: normal; }
#hud .stat b.money { color: var(--yellow); }
#hud .pen { color: var(--red); letter-spacing: 2px; }
#hud .spacer { flex: 1; }
#hud.minimal .stat { display: none; }
#muteBtn {
  background: transparent; border: 1px solid var(--line); color: var(--cyan);
  padding: 4px 10px; cursor: pointer; font-size: 13px; min-height: 32px;
}
#muteBtn:hover { border-color: var(--cyan); }

/* =========================================================
   레이아웃 / 공통
   ========================================================= */
#app { max-width: 980px; margin: 0 auto; padding: 16px 16px 40px; }
.screen { animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
h1, h2, h3 { font-weight: bold; }
.label { color: var(--dim); font-size: 12px; letter-spacing: .15em; margin: 18px 0 8px; }
.label::before { content: '// '; color: var(--mag); }
.hidden { display: none !important; }
.c-cyan { color: var(--cyan); } .c-mag { color: var(--mag); } .c-red { color: var(--red); }
.c-yel { color: var(--yellow); } .c-grn { color: var(--green); } .c-dim { color: var(--dim); }

.btn {
  font: inherit; font-size: 15px; background: transparent; color: var(--cyan);
  border: 1px solid var(--cyan); padding: 11px 16px; min-height: 46px; cursor: pointer;
  letter-spacing: .04em; transition: background .15s, box-shadow .15s, transform .05s;
}
.btn:hover:not(:disabled) { background: rgba(0,240,255,.12); box-shadow: 0 0 14px rgba(0,240,255,.4); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.mag { color: var(--mag); border-color: var(--mag); }
.btn.mag:hover:not(:disabled) { background: rgba(255,43,214,.12); box-shadow: 0 0 14px rgba(255,43,214,.4); }
.btn.red { color: var(--red); border-color: var(--red); }
.btn.red:hover:not(:disabled) { background: rgba(255,59,78,.12); box-shadow: 0 0 14px rgba(255,59,78,.4); }
.btn.yel { color: var(--yellow); border-color: var(--yellow); }
.btn.yel:hover:not(:disabled) { background: rgba(255,210,63,.1); box-shadow: 0 0 14px rgba(255,210,63,.35); }
.btn.solid { background: var(--cyan); color: #001014; font-weight: bold; }
.btn.solid:hover:not(:disabled) { background: #5ff6ff; }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }

.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
.actions {
  position: sticky; bottom: 0; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap;
  padding: 22px 0 calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, transparent, var(--bg) 35%);
}
.actions .btn { flex: 1 1 150px; }

/* 노이즈(깨진 기억) */
.corrupt {
  color: var(--mag); text-shadow: 1px 0 var(--cyan), -1px 0 var(--red);
  animation: jitter .25s steps(2) infinite; display: inline-block;
}
@keyframes jitter { 50% { transform: translate(1px,-1px); opacity: .75; } }

/* 깜빡이는 커서 */
.caret::after { content: '█'; color: var(--cyan); animation: blink 1s steps(2, jump-none) infinite; margin-left: 2px; }
</style>
<style>
/* =========================================================
   타이틀
   ========================================================= */
.title-screen { position: relative; min-height: calc(100dvh - 80px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; }
#rainCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .5; }
.logo {
  position: relative; font-size: clamp(54px, 15vw, 120px); letter-spacing: .18em; color: var(--text);
  text-shadow: 0 0 18px rgba(0,240,255,.7); line-height: 1; padding-left: .18em;
}
.logo::before, .logo::after { content: attr(data-text); position: absolute; inset: 0; padding-left: .18em; }
.logo::before { color: var(--cyan); animation: gl1 2.6s infinite steps(1); }
.logo::after  { color: var(--mag);  animation: gl2 3.1s infinite steps(1); }
@keyframes gl1 { 0%,88%,100% { transform: none; clip-path: inset(0 0 100% 0); } 90% { transform: translate(-5px,0); clip-path: inset(15% 0 55% 0); } 94% { transform: translate(4px,0); clip-path: inset(60% 0 10% 0); } }
@keyframes gl2 { 0%,82%,100% { transform: none; clip-path: inset(0 0 100% 0); } 85% { transform: translate(5px,0); clip-path: inset(40% 0 35% 0); } 91% { transform: translate(-3px,0); clip-path: inset(5% 0 80% 0); } }
.subtitle { color: var(--mag); letter-spacing: .25em; font-size: clamp(14px, 3.6vw, 20px); }
.intro { max-width: 560px; color: var(--dim); font-size: 14px; white-space: pre-line; min-height: 7em; text-align: left; }
.title-screen .btn { min-width: 240px; }
.records { color: var(--dim); font-size: 12px; }

/* =========================================================
   아침 공지
   ========================================================= */
.notice-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 10px 0 6px; }
.notice-head .day { font-size: clamp(34px, 9vw, 54px); color: var(--cyan); text-shadow: 0 0 14px rgba(0,240,255,.6); }
.notice-head .date { color: var(--dim); }
.monologue p { margin: 6px 0; }
.rule-list { list-style: none; display: grid; gap: 8px; }
.rule-list li { padding: 12px 14px; border-left: 3px solid var(--dim); background: var(--panel); }
.rule-list li.new { border-left-color: var(--mag); box-shadow: 0 0 18px rgba(255,43,214,.15); }
.rule-list li .tagline { font-size: 12px; color: var(--mag); margin-bottom: 2px; }
.rule-list li.old .tagline { color: var(--dim); }
.client-preview { color: var(--dim); font-size: 13px; }

/* =========================================================
   시술 화면
   ========================================================= */
.gauge-wrap { position: sticky; top: var(--hud-h, 46px); z-index: 30; background: rgba(10,10,18,.96); padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
.gauge-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 4px; letter-spacing: .08em; }
.gauge-top .pct { color: var(--cyan); }
.gauge { height: 14px; border: 1px solid var(--line); background: #06060c; position: relative; overflow: hidden; }
.gauge .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--mag)); box-shadow: 0 0 12px rgba(0,240,255,.6); }
.gauge::after { content: ''; position: absolute; left: 80%; top: 0; bottom: 0; width: 1px; background: var(--red); }
.gauge.hot .fill { background: var(--red); box-shadow: 0 0 14px var(--red); animation: blink .4s steps(2, jump-none) infinite; }
.gauge-wrap.hot .pct { color: var(--red); }

.client-head { display: flex; gap: 14px; align-items: center; margin: 14px 0 8px; }
.avatar {
  width: 72px; height: 72px; flex: none; display: grid; place-items: center; font-size: 40px;
  border: 1px solid var(--cyan); background: radial-gradient(circle, rgba(0,240,255,.15), transparent 70%);
  box-shadow: 0 0 16px rgba(0,240,255,.25);
}
.client-head h2 { font-size: 22px; color: var(--text); }
.client-head .meta { color: var(--dim); font-size: 13px; }
.dialog { min-height: 4.5em; cursor: pointer; }
.dialog p { margin: 4px 0; }
.dialog p::before { content: '> '; color: var(--mag); }
.request { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--yellow); color: var(--yellow); }
.request::before { content: '▶ 요청: '; color: var(--dim); }
.rules-mini { margin-top: 8px; font-size: 12px; color: var(--dim); }
.rules-mini span { margin-right: 10px; }
.tutorial { margin-top: 8px; padding: 10px 12px; font-size: 13px; color: var(--cyan); background: rgba(0,240,255,.06); border-left: 3px solid var(--cyan); }
#eeg { width: 100%; height: 54px; display: block; margin-top: 12px; border: 1px solid var(--line); background: #05050b; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card {
  position: relative; text-align: left; font: inherit; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); padding: 12px 12px 10px;
  cursor: pointer; min-height: 116px; transition: border-color .15s, box-shadow .15s, background .15s;
}
.card:hover:not(.locked) { border-color: var(--cyan); }
.card .no { color: var(--dim); font-size: 11px; letter-spacing: .15em; margin-bottom: 4px; }
.card .txt { font-size: 14px; }
.card.selected { border-color: var(--mag); background: linear-gradient(160deg, rgba(255,43,214,.12), var(--panel) 60%); box-shadow: 0 0 0 1px var(--mag), 0 0 18px rgba(255,43,214,.3); }
.card.selected::after { content: '삭제 대상'; position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--mag); border: 1px solid var(--mag); padding: 0 5px; transform: rotate(4deg); }
.card.locked { cursor: default; }
.card.erased { opacity: .45; }
.card.erased .txt { text-decoration: line-through; text-decoration-color: var(--mag); }
.card.erased::after { content: '삭제됨'; position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--red); border: 1px solid var(--red); padding: 0 5px; transform: rotate(-4deg); }
.card.fake { border-style: dashed; cursor: default; }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border: 1px solid var(--dim); color: var(--dim); margin: 8px 4px 0 0; }
.tag.forbid { color: var(--red); border-color: var(--red); }
.tag.forbid::after { content: ' ⚠삭제금지'; font-size: 10px; }
.tag.report { color: var(--yellow); border-color: var(--yellow); }
.tag.report::after { content: ' ⚠신고의무'; font-size: 10px; }

.result { margin-top: 14px; }
.result .ln { margin: 4px 0; }

/* =========================================================
   터미널 (결산 / 엔딩)
   ========================================================= */
.term {
  background: #05050b; border: 1px solid var(--line); padding: 16px; font-size: 14px;
  min-height: 260px; box-shadow: inset 0 0 40px rgba(0,240,255,.05); cursor: pointer; overflow-wrap: anywhere;
}
.term .ln { display: block; margin: 2px 0; white-space: pre-wrap; }
.term .ln.h { color: var(--cyan); }
.term .ln.ok { color: var(--green); }
.term .ln.warn { color: var(--yellow); }
.term .ln.bad { color: var(--red); }
.term .ln.mg { color: var(--mag); }
.term .ln.dim { color: var(--dim); }
.term .ln.big { font-size: clamp(22px, 6vw, 34px); color: var(--mag); text-shadow: 0 0 14px rgba(255,43,214,.6); margin: 10px 0; }
.term .ln.quote { color: var(--text); padding-left: 10px; border-left: 2px solid var(--mag); }

/* =========================================================
   밤 화면
   ========================================================= */
.night-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.harin { text-align: center; }
.harin pre { font-family: var(--font); font-size: 13px; line-height: 1.2; color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,.5); display: inline-block; text-align: left; }
.harin .cap { color: var(--dim); font-size: 12px; margin-top: 6px; }
.harin.glitch pre { color: var(--mag); animation: portrait .35s steps(3) infinite; }
@keyframes portrait { 0% { transform: translate(2px,0) skewX(4deg); } 33% { transform: translate(-3px,1px); filter: blur(1px); } 66% { transform: translate(1px,-1px) skewX(-6deg); } }
.state-ok { color: var(--green); } .state-warn { color: var(--yellow); } .state-bad { color: var(--red); animation: blink .8s steps(2, jump-none) infinite; }
.row-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.row-item:last-child { border-bottom: none; }
.row-item .desc { font-size: 12px; color: var(--dim); }
.row-item .price { color: var(--yellow); white-space: nowrap; }
.toggle { min-width: 86px; }
.toggle.on { background: rgba(0,240,255,.15); }
.toggle.off { color: var(--red); border-color: var(--red); }
.mem.sold .mtitle { color: var(--mag); }
.balance { margin-top: 10px; padding: 10px; border: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.balance .neg { color: var(--red); }
.warnline { color: var(--red); font-size: 13px; margin-top: 6px; min-height: 1.4em; }

/* =========================================================
   모바일 (세로)
   ========================================================= */
@media (max-width: 680px) {
  body { font-size: 14px; }
  #hud { gap: 2px 12px; padding: 6px 12px; font-size: 12px; }
  #hud .brand { width: 100%; min-height: 28px; display: flex; align-items: center; }
  #hudLicense, #hud .spacer { display: none; }
  #muteBtn { position: absolute; right: 12px; top: 5px; min-height: 28px; padding: 2px 8px; font-size: 12px; }
  #app { padding: 12px 12px 32px; }
  .night-grid { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr; }
  .card { min-height: 0; }
  .avatar { width: 58px; height: 58px; font-size: 32px; }
  .actions .btn { flex: 1 1 45%; padding: 10px 8px; font-size: 14px; }
  .term { font-size: 13px; padding: 12px; }
}
</style>
<style>
/* =========================================================
   도트 무대 (배경 + 초상) / 대화창 / 선택지
   ========================================================= */
.scene-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 6px 0 8px; flex-wrap: wrap; }
.scene-head .t { color: var(--cyan); letter-spacing: .12em; font-size: 13px; }
.scene-head .t b { color: var(--mag); font-weight: normal; }
.scene-head .r { color: var(--dim); font-size: 12px; }
.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 54vh; overflow: hidden;
  background: #000; border: 1px solid var(--line); box-shadow: 0 0 30px rgba(0,240,255,.07);
}
.stage canvas.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; image-rendering: crisp-edges; }
.stage canvas.pt { position: absolute; bottom: 0; left: 50%; height: 94%; transform: translateX(-50%); image-rendering: pixelated; image-rendering: crisp-edges; transition: opacity .2s, transform .2s; }
.stage canvas.pt.off { opacity: 0; transform: translateX(-50%) translateY(6%); }
.stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.55)); }
.stage .loc { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 12px; padding: 2px 8px; background: rgba(5,5,12,.78); border: 1px solid var(--line); color: var(--cyan); }
.stage.short { aspect-ratio: 16 / 6; max-height: 30vh; }
.stage.flash { animation: stageFlash .5s steps(3); }
@keyframes stageFlash { 0% { filter: brightness(3) saturate(0); } 100% { filter: none; } }

.vn {
  position: relative; margin-top: -1px; border: 1px solid var(--line); border-top: 2px solid var(--cyan);
  background: rgba(8,8,18,.97); padding: 12px 14px 28px; min-height: 124px; cursor: pointer; user-select: none;
}
.vn-name { display: inline-block; font-size: 13px; padding: 1px 10px; margin-bottom: 6px; background: var(--cyan); color: #001014; font-weight: bold; letter-spacing: .05em; }
.vn-name.me { background: var(--mag); color: #fff; }
.vn-name.narr { background: transparent; color: var(--dim); padding: 0; font-weight: normal; }
.vn-text { font-size: 16px; line-height: 1.7; min-height: 3.4em; }
.vn-text p { margin: 0; }
.vn-text.narr { color: #aeb8d4; }
.vn-next { position: absolute; right: 12px; bottom: 6px; font-size: 12px; color: var(--cyan); animation: bob .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); opacity: .5; } }
.vn-next.hidden { display: none; }
.vn .hint { position: absolute; left: 14px; bottom: 6px; font-size: 11px; color: var(--dim); }

.choices { display: grid; gap: 8px; margin-top: 10px; }
.choice {
  font: inherit; text-align: left; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--mag); padding: 12px 14px; min-height: 46px; cursor: pointer; font-size: 15px; transition: .15s;
}
.choice:hover { border-color: var(--mag); background: rgba(255,43,214,.08); }
.choice::before { content: '▸ '; color: var(--mag); }
.choice.end { border-left-color: var(--cyan); }
.choice.end::before { color: var(--cyan); }
.choice .note { display: block; font-size: 12px; color: var(--yellow); margin-top: 2px; }

/* 저녁 지도 */
.loc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.loc-card { font: inherit; color: var(--text); text-align: left; background: var(--panel); border: 1px solid var(--line); padding: 0; cursor: pointer; overflow: hidden; transition: .15s; position: relative; }
.loc-card:hover { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,.25); }
.loc-card canvas { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
.loc-card .info { padding: 8px 10px 10px; }
.loc-card .nm { font-weight: bold; color: var(--cyan); }
.loc-card .ds { font-size: 12px; color: var(--dim); }

/* =====================================================================
   미오의 크레파스 그림 (32x24 도트). 결산 화면에 하루 한 장씩 쌓인다
   ===================================================================== */
function crayon(c, pts, col) { c.fillStyle = col; pts.forEach(([x, y]) => c.fillRect(x + ((Math.random() * 2) | 0) * 0, y, 1, 1)); }
function cLine(c, x0, y0, x1, y1, col) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; c.fillStyle = col; for (let i = 0; i <= n; i++) c.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1); }
function cCircle(c, cx, cy, r, col, fill) { c.fillStyle = col; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) { const d = x * x + y * y; if (fill ? d <= r * r : Math.abs(d - r * r) <= r) c.fillRect(cx + x, cy + y, 1, 1); } }
function stick(c, x, y, col, coat) { cCircle(c, x, y, 2, col); cLine(c, x, y + 3, x, y + 9, coat || col); cLine(c, x, y + 5, x - 3, y + 7, col); cLine(c, x, y + 5, x + 3, y + 7, col); cLine(c, x, y + 9, x - 2, y + 13, col); cLine(c, x, y + 9, x + 2, y + 13, col); }
function cat(c, x, y, col) { cCircle(c, x, y, 2, col, true); c.fillStyle = col; c.fillRect(x - 2, y - 3, 1, 1); c.fillRect(x + 2, y - 3, 1, 1); c.fillRect(x - 3, y + 2, 6, 3); c.fillRect(x + 3, y + 1, 1, 2); }
const PAPER = '#f4efe2';
const DRAWINGS = {
  teacher: { title: '우리 선생님', draw: c => { stick(c, 10, 5, '#222', '#fff'); c.fillStyle = '#ddd'; c.fillRect(8, 8, 5, 6); stick(c, 10, 5, '#222'); cat(c, 22, 18, '#888'); cLine(c, 2, 22, 30, 22, '#3a8a3a'); } },
  dubu: { title: '두부', draw: c => { cat(c, 16, 12, '#777'); cCircle(c, 26, 5, 3, '#f0b020', true); cLine(c, 2, 20, 30, 20, '#3a6a3a'); } },
  rooftop: { title: '옥상에서', draw: c => { for (let i = 0; i < 6; i++) cLine(c, 2 + i * 5, 23, 2 + i * 5, 12 + (i % 3) * 3, '#334'); stick(c, 12, 6, '#222'); stick(c, 18, 9, '#d22'); cat(c, 24, 19, '#777'); for (let i = 0; i < 12; i++) c.fillRect((i * 7) % 30, (i * 5) % 10, 1, 2); } },
  sunflower: { title: '별이랑 해바라기', draw: c => { cCircle(c, 10, 8, 3, '#f0c020', true); c.fillStyle = '#7a4a1a'; c.fillRect(9, 7, 3, 3); cLine(c, 10, 11, 10, 22, '#3a8a3a'); stick(c, 22, 8, '#222', '#2a6ad0'); } },
  shield: { title: '지켜 주는 사람', draw: c => { stick(c, 12, 4, '#222', '#fff'); stick(c, 20, 10, '#d22'); cLine(c, 6, 2, 6, 20, '#00a0c0'); cLine(c, 6, 2, 26, 2, '#00a0c0'); } },
  rain: { title: '비 오는 날', draw: c => { for (let i = 0; i < 25; i++) cLine(c, (i * 7) % 32, (i * 3) % 12, (i * 7) % 32 - 1, (i * 3) % 12 + 3, '#4a7ad0'); cLine(c, 8, 10, 24, 10, '#d22'); cLine(c, 16, 10, 16, 18, '#222'); stick(c, 16, 13, '#222'); } },
  court: { title: '법정', draw: c => { c.fillStyle = '#7a4a2a'; c.fillRect(4, 14, 24, 4); cat(c, 16, 9, '#777'); stick(c, 6, 4, '#222'); for (let x = 2; x < 30; x += 4) cLine(c, x, 20, x, 23, '#7a4a2a'); } },
  broadcast: { title: '텔레비전 속 나', draw: c => { c.fillStyle = '#222'; c.fillRect(4, 3, 24, 16); c.fillStyle = '#6ac'; c.fillRect(6, 5, 20, 12); for (let y = 6; y < 16; y += 2) for (let x = 7; x < 25; x += 2) if ((x + y) % 4 === 0) c.fillRect(x, y, 2, 2); cat(c, 16, 11, '#777'); cLine(c, 12, 19, 10, 23, '#222'); cLine(c, 20, 19, 22, 23, '#222'); } },
  sea: { title: '바다 마을', draw: c => { for (let y = 12; y < 24; y++) cLine(c, 0, y, 31, y, y % 3 ? '#4a8ad0' : '#8ac0f0'); cCircle(c, 25, 5, 3, '#f0b020', true); stick(c, 10, 3, '#222'); cat(c, 15, 9, '#777'); } },
  together: { title: '하린 언니 깨어나면', draw: c => { stick(c, 9, 5, '#222', '#fff'); stick(c, 19, 5, '#a060c0'); cLine(c, 12, 10, 16, 10, '#d22'); cCircle(c, 26, 18, 3, '#f0c020', true); for (let x = 2; x < 30; x += 3) c.fillRect(x, 22, 2, 1); } },
  torn: { title: '(찢겨 나간 자리)', draw: c => { c.clearRect(0, 0, 32, 24); c.fillStyle = '#3a3a40'; for (let y = 0; y < 24; y++) c.fillRect(14 + ((y * 7) % 5), y, 2, 1); } },
};
function renderDrawing(cv, id) {
  const c = cv.getContext('2d');
  c.fillStyle = id === 'torn' ? '#1a1a20' : PAPER; c.fillRect(0, 0, 32, 24);
  const d = DRAWINGS[id];
  if (d) d.draw(c);
}

function selfCards(s) {
  const lv = truthLevel(s);
  const cards = MY_MEMORIES.filter(m => !isLost(m.id) && !m.fake).map(m => ({ text: `${m.mark} ${m.title} — ${m.diary}`, tags: ['서진', '검사 통과'], locked: true }));
  if (!isLost(3)) cards.push({ text: '③ 첫 시술 성공 — 박수 소리. 하린이 내 손을 잡아 준다. (이식 흔적 검출)', tags: ['이식', '검사 대상'], locked: true });
  cards.push(lv >= 3
    ? { key: 'experiment', text: '하얀 방. 출력 300%. "눌러, 한서진 연구원." 나는 버튼을 눌렀다. 하린의 뇌파가 직선이 된다.', tags: ['실험', '기업로고'], req: true }
    : lv >= 1
      ? { key: 'experiment', text: '▒▒▒ 지운 흔적. 시술자 0729 → 대상 0729. 내용 판독 불가. 그래도 무언가 있다.', tags: ['실험', '흔적'], req: true }

  return cards;
}

/* =====================================================================
   4. 판 기억 → 텍스트 노이즈 처리
   ===================================================================== */
function soldKeywords() {
  return [...state.sold, ...state.donated].flatMap(id => memById(id).keywords).sort((a, b) => b.length - a.length);
}
/* 텍스트를 [{t, c(깨짐여부)}] 조각으로 분해 */
function corruptParts(text) {
  const kws = soldKeywords();
  const parts = [];
  let buf = '', i = 0;
  outer: while (i < text.length) {
    for (const k of kws) {
      if (text.startsWith(k, i)) {
        if (buf) { parts.push({ t: buf }); buf = ''; }
        parts.push({ t: noise(k.length), c: true });
        i += k.length;
        continue outer;
      }
    }
    buf += text[i++];
  }
  if (buf) parts.push({ t: buf });
  return parts;
}
/* 한 번의 노이즈 생성으로 plain/html 두 버전을 함께 만든다 (타이핑 효과용) */
function fxPair(text) {
  const parts = corruptParts(String(text));
  return {
    plain: parts.map(p => p.t).join(''),
    html: parts.map(p => p.c ? `<span class="corrupt">${esc(p.t)}</span>` : esc(p.t)).join(''),
  };
}
const fx = text => fxPair(text).html;   // 즉시 렌더링용 HTML

const Sound = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type = 'square', vol = 0.04, slideTo = 0, delay = 0) {
    if (state.muted || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },
  click()  { this.tone(1200, 0.04, 'square', 0.03); },
  select() { this.tone(660, 0.05, 'triangle', 0.05); },
  warn()   { this.tone(220, 0.16, 'sawtooth', 0.05); this.tone(180, 0.16, 'sawtooth', 0.05, 0, 0.18); },
  alarm()  { this.tone(880, 0.09, 'square', 0.035); },
  erase()  { this.tone(1500, 0.5, 'sawtooth', 0.04, 120); this.tone(900, 0.12, 'square', 0.03, 0, 0.5); this.tone(1350, 0.18, 'square', 0.03, 0, 0.62); },
  coin()   { this.tone(988, 0.08, 'square', 0.04); this.tone(1319, 0.2, 'square', 0.04, 0, 0.08); },
  fail()   { this.tone(300, 0.6, 'sawtooth', 0.05, 60); },
  glitch() { for (let i = 0; i < 5; i++) this.tone(200 + Math.random() * 1800, 0.03, 'square', 0.025, 0, i * 0.04); },
};

/* lines: [{text, cls}] 를 container 안에 순서대로 타이핑. container 클릭 시 즉시 완료 */
function typeLines(container, lines, done, opts = {}) {
  const token = ++state.typeToken;
  const speed = opts.speed || 16;
  const gap = opts.gap || 220;
  const tag = opts.tag || 'p';
  const items = lines.map(l => (typeof l === 'string' ? { text: l } : l)).map(l => ({ ...l, ...fxPair(l.text) }));
  let li = 0, ci = 0, el = null, finished = false;

  const makeEl = it => { const e = document.createElement(tag); e.className = 'ln ' + (it.cls || ''); container.appendChild(e); return e; };
  const finish = () => {
    if (finished) return;
    finished = true;
    container.removeEventListener('click', skip);
    if (done) done();
  };
  function skip() {
    if (finished || token !== state.typeToken) return;
    state.typeToken++;
    if (el) { el.innerHTML = items[li].html; el.classList.remove('caret'); li++; }
    for (; li < items.length; li++) makeEl(items[li]).innerHTML = items[li].html;
    finish();
  }
  function step() {
    if (token !== state.typeToken) return;
    if (li >= items.length) { finish(); return; }
    const it = items[li];
    if (!el) { el = makeEl(it); el.classList.add('caret'); }
    ci = Math.min(ci + (opts.chunk || 1), it.plain.length);
    el.textContent = it.plain.slice(0, ci);
    if (ci >= it.plain.length) {
      el.innerHTML = it.html; el.classList.remove('caret');
      el = null; li++; ci = 0;
      later(step, it.pause || gap);
    } else later(step, speed);
  }
  if (!opts.noClick) container.addEventListener('click', skip);
  step();
  return skip;
}

/* =====================================================================
   PIXEL ART ENGINE — 도트 초상(32x36)과 배경(160x90)을 코드로 그린다
   ===================================================================== */
const PW = 32, PH = 36;
const DEFAULT_PAL = {
  k: '#0b0912', s: '#f0c4a4', S: '#c48a70', h: '#2a2236', H: '#17121f', l: '#4a3f62',
  e: '#1a1020', i: '#3b4e78', w: '#ffffff', m: '#9c4652', b: '#e8848a', B: '#1d1726',
  c: '#2c3a56', C: '#1b2438', d: '#d6dcea', x: '#ff2bd6', y: '#00f0ff', g: '#8d97ab',
  r: '#a2303c', v: '#00f0ff', o: '#ff3b4e', t: '#ffe9a8',
};

/* --- 머리 스타일: back(뒷머리, 얼굴보다 먼저) / front(앞머리, 얼굴 위에) --- */
function ell(x, y, cx, cy, rx, ry) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; return dx * dx + dy * dy <= 1; }
function fillWhere(P, fn, k) { for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) if (fn(x, y)) P.set(x, y, typeof k === 'function' ? k(x, y) : k); }
const hairShade = P => (x, y) => (x > P.cx + 3 ? 'H' : (x < P.cx - 2 && (x + y) % 5 === 0 && y < P.ey - 2) ? 'l' : 'h');
function cap(P, hairline, grow = 1.3) {
  fillWhere(P, (x, y) => y <= hairline && ell(x, y, P.cx, P.cy - 0.6, P.rx + grow, P.ry + grow), hairShade(P));
}
function sideLocks(P, fromY, toY, w = 2) {
  for (let y = fromY; y <= toY; y++) {
    const half = P.halfAt(y);
    if (half <= 0) continue;
    for (let i = 0; i < w; i++) {
      P.set(Math.floor(P.cx - half) + i, y, 'h');
      P.set(Math.ceil(P.cx + half) - 1 - i, y, 'H');
    }
  }
}
const HAIR = {
  bob: {
    back: P => fillWhere(P, (x, y) => y >= P.cy - P.ry && y <= P.ey + 7 && ell(x, y, P.cx, P.cy + 1, P.rx + 2.4, P.ry + 2.2), hairShade(P)),
    front: P => { cap(P, P.ey - 3); sideLocks(P, P.ey - 3, P.ey + 6, 2);
      [P.cx - 4, P.cx - 1, P.cx + 2].forEach(x => P.set(Math.floor(x), P.ey - 2, 'h')); },
  },
  long: {
    back: P => fillWhere(P, (x, y) => y >= P.cy - P.ry && (ell(x, y, P.cx, P.cy, P.rx + 2.4, P.ry + 2) || (y > P.cy && y < 35 && Math.abs(x + 0.5 - P.cx) < P.rx + 2.2 + (y - P.cy) * 0.12)), hairShade(P)),
    front: P => { cap(P, P.ey - 4); sideLocks(P, P.ey - 4, P.ey + 8, 2);
      for (let y = P.ey - 4; y <= P.ey - 2; y++) { P.set(Math.floor(P.cx) - 2 - (y - P.ey + 4), y, 'h'); P.set(Math.ceil(P.cx) + 1 + (y - P.ey + 4), y, 'H'); }
      P.set(15, P.ey - 4, null); P.set(16, P.ey - 4, null); },
  },
  twin: {
    back: P => {
      fillWhere(P, (x, y) => ell(x, y, 6.5, P.ey + 4, 3.2, 8) || ell(x, y, 25.5, P.ey + 4, 3.2, 8), (x, y) => (x > 20 ? 'H' : 'h'));
    },
    front: P => { cap(P, P.ey - 3); sideLocks(P, P.ey - 3, P.ey + 3, 1);
      [[8, P.ey - 4], [9, P.ey - 4], [8, P.ey - 3], [23, P.ey - 4], [22, P.ey - 4], [23, P.ey - 3]].forEach(([x, y]) => P.set(x, y, 'x'));
      for (let x = 12; x <= 19; x += 3) P.set(x, P.ey - 2, 'h'); },
  },
  short: {
    front: P => { cap(P, P.ey - 4, 0.9); sideLocks(P, P.ey - 4, P.ey, 1);
      [11, 14, 17, 20].forEach(x => P.set(x, Math.floor(P.cy - P.ry) - 1, 'h')); },
  },
  slick: {
    front: P => { cap(P, P.ey - 5, 1.0); sideLocks(P, P.ey - 5, P.ey - 1, 1);
      for (let i = 0; i < 6; i++) P.set(11 + i * 2, Math.floor(P.cy - P.ry) + 1 + (i % 2), 'l'); },
  },
  hood: {
    back: P => fillWhere(P, (x, y) => y <= P.cy + P.ry + 3 && ell(x, y, P.cx, P.cy + 0.5, P.rx + 3.4, P.ry + 3.2), (x, y) => (x > P.cx + 4 ? 'C' : 'c')),
    front: P => { cap(P, P.ey - 3, 0.6);
      for (let x = 10; x <= 15; x++) P.set(x, P.ey - 2 + (x % 2), 'h');
      fillWhere(P, (x, y) => y < P.ey - 2 && ell(x, y, P.cx, P.cy + 0.5, P.rx + 3.4, P.ry + 3.2) && !ell(x, y, P.cx, P.cy + 0.5, P.rx + 1.6, P.ry + 1.6), (x) => (x > P.cx + 4 ? 'C' : 'c')); },
  },
  bald: {
    front: P => { sideLocks(P, P.ey - 3, P.ey + 1, 2);
      for (let x = 13; x <= 18; x += 2) P.set(x, Math.floor(P.cy - P.ry) + 1, 'h');
      for (let x = 13; x <= 18; x++) { if (x % 3) P.set(x, P.ey - 5, 'S'); if ((x + 1) % 3) P.set(x, P.ey - 4, 'S'); } },
  },
  bun: {
    back: P => fillWhere(P, (x, y) => ell(x, y, P.cx, P.cy - P.ry - 1.2, 3.2, 2.6), hairShade(P)),
    front: P => { cap(P, P.ey - 4); sideLocks(P, P.ey - 4, P.ey + 1, 1);
      fillWhere(P, (x, y) => y >= P.cy - P.ry - 1 && y <= P.cy - P.ry + 1 && Math.abs(x + 0.5 - P.cx) < 5, 'd');
      P.set(15, Math.floor(P.cy - P.ry), 'r'); P.set(16, Math.floor(P.cy - P.ry), 'r'); P.set(15, Math.floor(P.cy - P.ry) - 1, 'r'); P.set(15, Math.floor(P.cy - P.ry) + 1, 'r'); },
  },
  undercut: {
    front: P => { cap(P, P.ey - 4, 1.1);
      for (let y = P.ey - 4; y <= P.ey + 3; y++) for (let x = 16 + Math.max(0, y - P.ey + 1); x <= 22; x++) if (P.inHead(x, y) || y < P.ey) P.set(x, y, y >= P.ey + 1 ? 'x' : (x > 19 ? 'H' : 'h'));
      for (let y = P.ey - 5; y <= P.ey - 1; y++) { P.set(9, y, 'B'); P.set(10, y, 'B'); } },
  },
  messy: {
    front: P => { cap(P, P.ey - 3, 1.4); sideLocks(P, P.ey - 3, P.ey + 1, 1);
      const top = Math.floor(P.cy - P.ry) - 1;
      [[10, 1], [12, 2], [15, 1], [17, 2], [20, 1], [21, 0]].forEach(([x, d]) => { for (let i = 0; i < d; i++) P.set(x, top - i, 'h'); });
      [11, 13, 16, 18].forEach(x => P.set(x, P.ey - 2, 'h')); },
  },
  bowl: {
    front: P => { cap(P, P.ey - 3, 1.2); sideLocks(P, P.ey - 3, P.ey + 2, 2); },
  },
  pillow: { // 누워 있는 하린: 베개 위로 퍼진 긴 머리
    back: P => { fillWhere(P, (x, y) => y > P.cy - 5 && y < P.cy + 9 && Math.abs(x + 0.5 - P.cx) < 11.5, (x, y) => ((x + y) % 7 === 0 ? 'g' : 'd'));
      fillWhere(P, (x, y) => y >= P.cy - P.ry && (ell(x, y, P.cx, P.cy + 1, P.rx + 3.2, P.ry + 2.4) || (y > P.cy && y < 30 && Math.abs(x + 0.5 - P.cx) < P.rx + 4)), hairShade(P)); },
    front: P => { cap(P, P.ey - 3); sideLocks(P, P.ey - 3, P.ey + 7, 2); },
  },
};

/* --- 눈 / 입 --- */
function drawEyes(P, style) {
  const ey = P.ey, L = 12, R = 18;
  const pair = (fn) => { fn(L, 1); fn(R, -1); };
  switch (style) {
    case 'closed':
      pair(x => { P.set(x - 1, ey + 1, 'e'); P.set(x, ey + 1, 'e'); P.set(x + 1, ey + 1, 'e'); P.set(x + 2, ey + 1, 'e'); P.set(x, ey + 2, 'S'); });
      break;
    case 'narrow':
      pair(x => { P.set(x - 1, ey, 'S'); P.set(x, ey, 'S'); P.set(x + 1, ey, 'S'); P.set(x, ey + 1, 'e'); P.set(x + 1, ey + 1, 'e'); });
      break;
    case 'big':
      pair(x => { P.set(x, ey - 1, 'e'); P.set(x + 1, ey - 1, 'e'); P.set(x, ey, 'w'); P.set(x + 1, ey, 'i'); P.set(x, ey + 1, 'i'); P.set(x + 1, ey + 1, 'e'); P.set(x - 1, ey - 1, 'e'); });
      break;
    case 'tired':
      pair(x => { P.set(x - 1, ey, 'e'); P.set(x, ey, 'e'); P.set(x + 1, ey, 'e'); P.set(x, ey + 1, 'w'); P.set(x + 1, ey + 1, 'i'); P.set(x, ey + 2, 'S'); P.set(x + 1, ey + 2, 'S'); });
      break;
    case 'none': break;
    default: // normal
      pair(x => { P.set(x - 1, ey, 'e'); P.set(x, ey, 'e'); P.set(x + 1, ey, 'e'); P.set(x, ey + 1, 'w'); P.set(x + 1, ey + 1, 'i'); });
  }
  P.eyes = [];
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) if (['e', 'w', 'i'].includes(P.get(x, y)) && Math.abs(y - ey) <= 2) P.eyes.push([x, y]);
}
function drawBrows(P, style) {
  const y = P.ey - 2;
  const L = [11, 12, 13], R = [18, 19, 20];
  if (style === 'none') return;
  L.forEach((x, i) => P.set(x, y + (style === 'angry' ? (i === 2 ? 1 : 0) : style === 'sad' ? (i === 0 ? 1 : 0) : 0), 'B'));
  R.forEach((x, i) => P.set(x, y + (style === 'angry' ? (i === 0 ? 1 : 0) : style === 'sad' ? (i === 2 ? 1 : 0) : 0), 'B'));
}
function drawMouth(P, style) {
  if (style === 'none') { P.mouth = []; return; }
  const my = P.ey + 5;
  const pts = { neutral: [[15, my], [16, my]], smile: [[14, my], [15, my + 1], [16, my + 1], [17, my]],
    frown: [[14, my + 1], [15, my], [16, my], [17, my + 1]], wide: [[14, my], [15, my], [16, my], [17, my]],
    small: [[15, my]], smirk: [[15, my], [16, my], [17, my - 1]] }[style] || [[15, my], [16, my]];
  pts.forEach(([x, y]) => P.set(x, y, 'm'));
  P.mouth = pts;
}

/* --- 옷 --- */
const OUTFIT = {
  coat: P => { for (let y = 28; y < PH; y++) { const w = Math.max(0, 3 - (y - 28) * 0.5); for (let x = 16 - w; x < 16 + w; x++) P.set(Math.round(x), y, 'd'); P.set(Math.round(15 - w), y, 'C'); P.set(Math.round(16 + w), y, 'C'); }
    for (let y = 25; y <= 28; y++) { P.set(11, y, 'c'); P.set(12, y, 'c'); P.set(19, y, 'C'); P.set(20, y, 'C'); } },
  suit: P => { OUTFIT.coat(P); for (let y = 28; y < PH; y++) { P.set(15, y, 'x'); P.set(16, y, 'x'); } P.set(15, 28, 'r'); P.set(16, 28, 'r'); },
  hoodie: P => { [14, 17].forEach(x => { for (let y = 29; y <= 32; y++) P.set(x, y, 'd'); }); for (let x = 11; x <= 20; x++) P.set(x, 34, 'C'); },
  uniform: P => { for (let y = 27; y <= 31; y++) { const w = 7 - (y - 27); for (let x = 16 - w; x < 16 + w; x++) if (Math.abs(x + 0.5 - 16) > (31 - y) * 0.5 - 1) P.set(x, y, 'd'); }
    [[15, 31], [16, 31], [14, 32], [17, 32], [15, 32], [16, 32]].forEach(([x, y]) => P.set(x, y, 'x')); },
  vest: P => { for (let x = 4; x < 28; x++) if (P.get(x, 32)) P.set(x, 32, 'y'); for (let y = 28; y < 32; y++) { P.set(12, y, 'C'); P.set(19, y, 'C'); } for (let x = 14; x <= 17; x++) P.set(x, 27, 'd'); },
  gown: P => { for (let y = 28; y < PH; y++) for (let x = 0; x < PW; x++) if (P.get(x, y) === 'c' && (x * 3 + y * 5) % 9 === 0) P.set(x, y, 'd'); for (let x = 13; x <= 18; x++) P.set(x, 28, 'd'); },
  nurse: P => { for (let x = 13; x <= 18; x++) P.set(x, 28, 'd'); [[22, 31], [21, 31], [23, 31], [22, 30], [22, 32]].forEach(([x, y]) => P.set(x, y, 'r')); },
  cardigan: P => { for (let y = 28; y < PH; y++) { P.set(15, y, 'C'); } [29, 31, 33].forEach(y => P.set(16, y, 'd')); for (let x = 13; x <= 18; x++) P.set(x, 27, 'd'); },
  bartender: P => { for (let y = 27; y < PH; y++) { for (let x = 0; x < PW; x++) if (P.get(x, y) && Math.abs(x + 0.5 - 16) > 7 + (y - 27) * 0.6) P.set(x, y, 'd'); }
    [[14, 27], [15, 28], [16, 28], [17, 27], [14, 28], [17, 28]].forEach(([x, y]) => P.set(x, y, 'x')); for (let y = 29; y < PH; y++) P.set(15, y, 'C'); },
  parka: P => { for (let y = 26; y <= 28; y++) for (let x = 9; x <= 22; x++) if (P.get(x, y) === 'c' || P.get(x, y) === 'C') P.set(x, y, (x + y) % 2 ? 'd' : 'g');
    [[10, 31], [11, 31], [10, 32], [11, 32]].forEach(([x, y]) => P.set(x, y, 'y')); },
  tshirt: P => { [[16, 30], [15, 31], [16, 31], [17, 31], [16, 32], [14, 31], [18, 31]].forEach(([x, y]) => P.set(x, y, 'y')); for (let x = 13; x <= 18; x++) P.set(x, 27, 'C'); },
  blouse: P => { [[13, 27], [14, 28], [18, 27], [17, 28]].forEach(([x, y]) => P.set(x, y, 'd')); for (let y = 29; y < PH; y += 2) P.set(16, y, 'd'); },
  apron: P => { for (let y = 29; y < PH; y++) for (let x = 11; x <= 20; x++) if (P.get(x, y)) P.set(x, y, (x === 11 || x === 20) ? 'C' : 'd'); for (let x = 13; x <= 18; x++) P.set(x, 28, 'g'); },
  raincoat: P => { for (let y = 29; y < PH; y += 2) P.set(16, y, 'C'); [[14, 31], [17, 31]].forEach(([x, y]) => P.set(x, y, 'd')); },
  agent: P => { OUTFIT.coat(P); for (let y = 28; y < PH; y++) { P.set(15, y, 'k'); P.set(16, y, 'k'); } [[8, 30], [9, 30], [8, 31]].forEach(([x, y]) => P.set(x, y, 'r')); },
};

/* --- 액세서리 --- */
const ACC = {
  glasses: P => { const y = P.ey; [11, 17].forEach(x0 => { for (let x = x0; x <= x0 + 3; x++) { P.set(x, y - 1, 'g'); P.set(x, y + 2, 'g'); } P.set(x0, y, 'g'); P.set(x0, y + 1, 'g'); P.set(x0 + 3, y, 'g'); P.set(x0 + 3, y + 1, 'g'); }); P.set(15, y, 'g'); P.set(16, y, 'g'); },
  scar: P => { [[11, P.ey - 3], [12, P.ey - 2], [13, P.ey + 2], [13, P.ey + 3], [14, P.ey + 4]].forEach(([x, y]) => P.set(x, y, 'r')); },
  cig: P => { const y = P.ey + 5; [18, 19, 20].forEach(x => P.set(x, y, 'w')); P.set(21, y, 'o'); P.set(22, y - 2, 'g'); P.set(23, y - 4, 'g'); },
  stubble: P => { for (let x = 12; x <= 19; x++) for (let y = P.ey + 6; y <= P.ey + 7; y++) if ((P.get(x, y) === 's' || P.get(x, y) === 'S') && (x + y) % 2 === 0) P.set(x, y, 'S'); },
  visor: P => { for (let x = 10; x <= 21; x++) { P.set(x, P.ey, 'v'); P.set(x, P.ey + 1, x % 4 === 0 ? 'w' : 'v'); } P.set(9, P.ey, 'g'); P.set(22, P.ey, 'g'); },
  cyberEye: P => { const x = 18, y = P.ey; [[x - 1, y - 1], [x, y - 1], [x + 1, y - 1], [x + 2, y - 1], [x - 1, y + 2], [x + 2, y + 2], [x + 2, y], [x + 2, y + 1]].forEach(([a, b]) => P.set(a, b, 'g')); P.set(x, y, 'o'); P.set(x + 1, y, 'o'); P.set(x, y + 1, 'o'); P.set(x + 1, y + 1, 'w'); },
  earring: P => { const half = P.halfAt(P.ey + 3); P.set(Math.floor(P.cx - half) - 1, P.ey + 4, 'y'); P.set(Math.ceil(P.cx + half), P.ey + 4, 'x'); },
  tube: P => { const y = P.ey + 4; [11, 12, 13, 14, 17, 18, 19, 20].forEach(x => P.set(x, y + (x < 13 || x > 18 ? 1 : 0), 'g')); P.set(15, y - 1, 'g'); P.set(16, y - 1, 'g'); },
  tear: P => { P.set(12, P.ey + 2, 'y'); P.set(12, P.ey + 3, 'y'); },
  bandage: P => { [[19, P.ey + 3], [20, P.ey + 3], [19, P.ey + 4], [20, P.ey + 4]].forEach(([x, y]) => P.set(x, y, 't')); },
  blush: P => { [[11, P.ey + 3], [12, P.ey + 3], [19, P.ey + 3], [20, P.ey + 3]].forEach(([x, y]) => { if (P.get(x, y) === 's' || P.get(x, y) === 'S') P.set(x, y, 'b'); }); },
  wrinkles: P => { [[11, P.ey + 3], [20, P.ey + 3], [12, P.ey + 6], [19, P.ey + 6]].forEach(([x, y]) => P.set(x, y, 'S')); },
  mustache: P => { for (let x = 13; x <= 18; x++) P.set(x, P.ey + 4, x === 13 || x === 18 ? 'H' : 'h'); },
  headphones: P => { const half = P.halfAt(P.ey + 1); const lx = Math.floor(P.cx - half) - 1, rx = Math.ceil(P.cx + half); for (let y = P.ey - 1; y <= P.ey + 3; y++) { P.set(lx, y, 'g'); P.set(rx, y, 'g'); P.set(lx - 1, y, 'k'); P.set(rx + 1, y, 'k'); } P.set(lx, P.ey + 1, 'y'); P.set(rx, P.ey + 1, 'y'); },
  ledEyes: P => { [[11, P.ey + 1], [12, P.ey + 1], [13, P.ey + 1], [18, P.ey + 1], [19, P.ey + 1], [20, P.ey + 1]].forEach(([x, y]) => P.set(x, y, 'v')); P.set(12, P.ey, 'w'); P.set(19, P.ey, 'w'); },
  seams: P => { for (let y = P.ey - 4; y <= P.ey + 7; y++) { if (P.get(10, y) === 's') P.set(10, y, 'g'); if (P.get(21, y) === 'S') P.set(21, y, 'g'); } [[14, P.ey + 7], [15, P.ey + 7], [16, P.ey + 7], [17, P.ey + 7]].forEach(([x, y]) => P.set(x, y, 'g')); },
  freckles: P => { [[11, P.ey + 3], [13, P.ey + 3], [18, P.ey + 3], [20, P.ey + 3]].forEach(([x, y]) => P.set(x, y, 'S')); },
  badge: P => { [[10, 31], [11, 31], [10, 32], [11, 32]].forEach(([x, y]) => P.set(x, y, 'y')); },
};

/* --- 초상 생성 --- */
function buildPortrait(def) {
  const grid = Array.from({ length: PH }, () => Array(PW).fill(null));
  const P = {
    def, cx: 16, cy: def.faceY || 15.5, rx: def.faceW || 6.4, ry: def.faceH || 8.2, ey: def.eyeY || 16,
    set(x, y, k) { if (x >= 0 && y >= 0 && x < PW && y < PH) grid[y][x] = k; },
    get(x, y) { return x >= 0 && y >= 0 && x < PW && y < PH ? grid[y][x] : null; },
  };
  P.inHead = (x, y) => { const dy = (y + 0.5 - P.cy) / P.ry; if (Math.abs(dy) > 1) return false; const r = dy > 0 ? P.rx * (1 - 0.34 * dy * dy) : P.rx; const dx = (x + 0.5 - P.cx) / r; return dx * dx + dy * dy <= 1; };
  P.halfAt = y => { let n = 0; for (let x = 0; x < PW; x++) if (P.inHead(x, y)) n++; return n / 2; };
  const hair = HAIR[def.hair] || {};
  if (hair.back) hair.back(P);
  // 몸통
  const sy = def.bodyY || 27;
  for (let y = sy; y < PH; y++) {
    const half = Math.min(15.5, (def.bodyW || 6.5) + (y - sy) * 1.7);
    for (let x = 0; x < PW; x++) { const d = x + 0.5 - 16; if (Math.abs(d) <= half) P.set(x, y, d > half * 0.35 ? 'C' : 'c'); }
  }
  // 목
  const chin = Math.floor(P.cy + P.ry);
  for (let y = chin - 2; y <= sy + 1; y++) for (let x = 13; x <= 18; x++) P.set(x, y, x >= 17 || y === chin ? 'S' : 's');
  (OUTFIT[def.outfit] || (() => {}))(P);
  // 얼굴
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) if (P.inHead(x, y)) P.set(x, y, x + 0.5 >= P.cx + P.rx * 0.45 || y >= chin - 1 && x > 16 ? 'S' : 's');
  // 귀
  if (!def.noEars) { const half = P.halfAt(P.ey + 1); for (let y = P.ey; y <= P.ey + 2; y++) { P.set(Math.floor(P.cx - half) - 1, y, 's'); P.set(Math.ceil(P.cx + half), y, 'S'); } }
  drawEyes(P, def.eyes || 'normal');
  drawBrows(P, def.brows || 'flat');
  P.set(16, P.ey + 3, 'S');
  drawMouth(P, def.mouth || 'neutral');
  if (hair.front) hair.front(P);
  // 앞머리 그림자
  for (let y = 1; y < PH; y++) for (let x = 0; x < PW; x++) if (P.get(x, y) === 's' && ['h', 'H', 'l'].includes(P.get(x, y - 1))) P.set(x, y, 'S');
  (def.acc || []).forEach(a => ACC[a] && ACC[a](P));
  // 외곽선
  const out = grid.map(r => r.slice());
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    if (grid[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const v = P.get(x + dx, y + dy); return v && v !== 'k'; })) out[y][x] = 'k';
  }
  // 림 라이트: 왼쪽 가장자리는 rim(시안), 오른쪽은 rim2(마젠타). 피부는 제외
  const rim = out.map(r => r.slice());
  const skin = k => k === 's' || k === 'S' || k === 'b';
  for (let y = 0; y < PH; y++) for (let x = 1; x < PW - 1; x++) {
    const k = out[y][x];
    if (!k || k === 'k' || skin(k)) continue;
    if (out[y][x - 1] === 'k' || out[y][x - 1] === null) rim[y][x] = 'R';
    else if (out[y][x + 1] === 'k' || out[y][x + 1] === null) rim[y][x] = 'Q';
  }
  return { grid: rim, eyes: P.eyes || [], mouth: P.mouth || [], pal: Object.assign({}, DEFAULT_PAL, { R: def.rim || '#3fd8e8', Q: def.rim2 || '#a8329a' }, def.pal) };
}

const PORTRAIT_CACHE = {};
function portraitData(id) {
  if (!PORTRAIT_CACHE[id]) PORTRAIT_CACHE[id] = buildPortrait(CHARACTERS[id].look);
  return PORTRAIT_CACHE[id];
}
/* opts: { blink, talk, glitch(0~1), tint } */
function drawPortrait(ctx, id, opts = {}) {
  const pd = portraitData(id);
  ctx.clearRect(0, 0, PW, PH);
  const eyeSet = opts.blink ? new Set(pd.eyes.map(([x, y]) => x + ',' + y)) : null;
  for (let y = 0; y < PH; y++) {
    let shift = 0;
    if (opts.glitch && Math.random() < opts.glitch * 0.25) shift = ((Math.random() * 5) | 0) - 2;
    for (let x = 0; x < PW; x++) {
      let k = pd.grid[y][x];
      if (!k) continue;
      let col = pd.pal[k] || '#ff00ff';
      if (eyeSet && eyeSet.has(x + ',' + y)) col = pd.pal.S;
      if (opts.glitch && Math.random() < opts.glitch * 0.18) col = ['#ff2bd6', '#00f0ff', '#0b0912', '#ffffff'][(Math.random() * 4) | 0];
      ctx.fillStyle = col;
      ctx.fillRect(x + shift, y, 1, 1);
    }
  }
  if (opts.talk && pd.mouth.length) {
    ctx.fillStyle = '#2a0c14';
    pd.mouth.forEach(([x, y]) => ctx.fillRect(x, y, 1, 2));
  }
  if (opts.tint) { ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = opts.tint; ctx.fillRect(0, 0, PW, PH); ctx.globalCompositeOperation = 'source-over'; }
}

const BW = 160, BH = 90;

function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function ptext(c, str, x, y, col, vertical) {
  c.fillStyle = col;

}
function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function skyBands(c, top, bottom, y0, y1) {
  const steps = 6;
  for (let i = 0; i < steps; i++) { const t = i / (steps - 1); R(c, 0, y0 + (y1 - y0) * i / steps, BW, (y1 - y0) / steps + 1, mix(top, bottom, t)); }
}
function mix(a, b, t) { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16); const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t); return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join(''); }
function skyline(c, rnd, y, color, lightCol, density) {
  let x = 0;
  while (x < BW) { const w = 6 + rnd() * 14 | 0, h = 10 + rnd() * 30 | 0; R(c, x, y - h, w, h + 40, color);
    for (let wy = y - h + 2; wy < y + 30; wy += 3) for (let wx = x + 1; wx < x + w - 1; wx += 2) if (rnd() < density) R(c, wx, wy, 1, 1, lightCol[(rnd() * lightCol.length) | 0]);
    x += w + (rnd() * 3 | 0); }
}
function neonBox(c, x, y, w, h, col) { c.globalAlpha = 0.18; R(c, x - 2, y - 2, w + 4, h + 4, col); c.globalAlpha = 1; R(c, x, y, w, 1, col); R(c, x, y + h - 1, w, 1, col); R(c, x, y, 1, h, col); R(c, x + w - 1, y, 1, h, col); }
function rain(c, t, rnd, count, col, area) {
  c.fillStyle = col;
  const [ax, ay, aw, ah] = area || [0, 0, BW, BH];
  for (let i = 0; i < count; i++) { const sx = (i * 37.7 + i * i * 0.13) % aw, sp = 1.6 + (i % 5) * 0.35; const y = (i * 13.3 + t * sp * 18) % (ah + 6) - 4; const x = (sx - y * 0.25 + aw) % aw; c.fillRect(ax + x | 0, ay + y | 0, 1, 2 + (i % 2)); }
}
function eeg(c, x, y, w, h, t, col, speed = 1) {
  c.fillStyle = col;
  for (let i = 0; i < w; i++) { const p = (i + t * 20 * speed) * 0.35; let v = Math.sin(p) * h * 0.25; if (((i + (t * 20 * speed | 0)) % 28) < 2) v -= h * 0.4; c.fillRect(x + i, y + h / 2 + v | 0, 1, 1); }
}

const BG_CACHE = {};
function bgBase(name) {
  if (!BG_CACHE[name]) {
    const cv = document.createElement('canvas'); cv.width = BW; cv.height = BH;
    const c = cv.getContext('2d');
    (BACKGROUNDS[name] || BACKGROUNDS.alley).base(c);
    BG_CACHE[name] = cv;
  }
  return BG_CACHE[name];
}
function drawBackground(ctx, name, t, opts) {
  ctx.drawImage(bgBase(name), 0, 0);
  const b = BACKGROUNDS[name] || BACKGROUNDS.alley;
  if (b.anim) b.anim(ctx, t, opts);
}

/* 공통 오버레이: static(노이즈 0~1), dream(몽환), tint */
const _drawBackground = drawBackground;
drawBackground = function (ctx, name, t, opts) {
  _drawBackground(ctx, name, t, opts);
  if (!opts) return;
  if (opts.dream) { ctx.globalAlpha = 0.18 + Math.sin(t) * 0.04; ctx.fillStyle = '#b48aff'; ctx.fillRect(0, 0, BW, BH); ctx.globalAlpha = 1; }
  if (opts.static || name === 'static') {
    const amt = name === 'static' ? 1 : opts.static;
    for (let i = 0; i < 1400 * amt; i++) { const v = (Math.random() * 120 + 60) | 0; ctx.fillStyle = `rgb(${v},${v},${v + 8})`; ctx.fillRect((Math.random() * BW) | 0, (Math.random() * BH) | 0, 2, 1); }
    if (Math.random() < 0.3) { ctx.fillStyle = 'rgba(255,43,214,.25)'; ctx.fillRect(0, (Math.random() * BH) | 0, BW, 2); }
  }
  if (opts.tint) { ctx.globalAlpha = 0.25; ctx.fillStyle = opts.tint; ctx.fillRect(0, 0, BW, BH); ctx.globalAlpha = 1; }
};

/* =====================================================================
   7. 도트 무대 + 대화(VN) 엔진
   ===================================================================== */
const Stage = { bg: 'alley', who: null, opts: {}, talking: false, blinkUntil: 0, nextBlink: 0 };

function stageHTML(loc, cls) {
  return `<div class="stage ${cls || ''}" id="stage">
    <canvas class="bg" id="bgCv" width="${BW}" height="${BH}"></canvas>
    <canvas class="pt off" id="ptCv" width="${PW}" height="${PH}"></canvas>
    ${loc ? `<div class="loc">${esc(loc)}</div>` : ''}</div>`;
}
function vnHTML() {
  return `<div class="vn" id="vn"><div class="vn-name narr" id="vnName"></div><div class="vn-text" id="vnText"></div>
    <span class="hint">탭 · Space 로 넘기기</span><div class="vn-next hidden" id="vnNext">▼</div></div>
    <div class="choices" id="choices"></div>`;
}
function portraitGlitch(id) { return (id === 'harin' || id === 'harinAwake') && isSold(4) ? 0.45 : 0; }

/* 배경·초상 애니메이션 루프 (약 12fps, 도트 느낌 유지) */
function startStage(bg, who, opts) {
  Stage.bg = bg; Stage.opts = opts || {}; Stage.talking = false;
  const bgCv = $('#bgCv'), ptCv = $('#ptCv');
  if (!bgCv) return;
  const bctx = bgCv.getContext('2d'), pctx = ptCv.getContext('2d');
  setPortrait(who);
  const t0 = performance.now();
  let last = 0;
  const loop = now => {
    state.raf = requestAnimationFrame(loop);
    if (!bgCv.isConnected) { cancelAnimationFrame(state.raf); return; }
    if (now - last < 80) return;
    last = now;
    const t = (now - t0) / 1000;
    drawBackground(bctx, Stage.bg, t, Stage.opts);
    const scan = state.screen === 'client' && state.client && state.client.running ? state.client.scan / 100 : 0;
    if (scan > 0.5) { bctx.globalAlpha = (scan - 0.5) * 0.5 * (0.6 + 0.4 * Math.sin(t * 9)); bctx.fillStyle = '#ff3b4e'; bctx.fillRect(0, 0, BW, BH); bctx.globalAlpha = 1; }
    pctx.clearRect(0, 0, PW, PH);
    if (Stage.who) {
      if (now > Stage.nextBlink) { Stage.blinkUntil = now + 140; Stage.nextBlink = now + 2200 + Math.random() * 2800; }
      drawPortrait(pctx, Stage.who, {
        blink: now < Stage.blinkUntil,
        talk: Stage.talking && ((now / 130) | 0) % 2 === 0,
        glitch: portraitGlitch(Stage.who) + (scan > 0.8 ? 0.15 : 0),
        tint: CHARACTERS[Stage.who].tint,
      });
    }
  };
  state.raf = requestAnimationFrame(loop);
}
function setPortrait(who) {
  Stage.who = who && CHARACTERS[who] ? who : null;
  const pt = $('#ptCv');
  if (pt) pt.classList.toggle('off', !Stage.who);
}
function setBg(bg, opts) {
  Stage.bg = bg;
  Stage.opts = opts || {};
  const st = $('#stage');
  if (st) { st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash'); }
  Sound.glitch();
}

/* VN 입력: 대화창 클릭 / Space / Enter */
function bindVN() {
  const box = $('#vn');
  if (box) box.addEventListener('click', () => { if (state.vnAdvance) state.vnAdvance(); });
}
document.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  if (state.modalOpen || !state.vnAdvance) return;
  if (e.target && e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  state.vnAdvance();
});

const textOf = v => (typeof v === 'function' ? v(state) : v);

/* 스크립트 실행기: steps를 순서대로 실행한 뒤 done() */
function runScript(steps, done) {
  const sess = state.vnSession;
  let i = 0;
  const next = () => {
    if (sess !== state.vnSession) return;
    if (i >= steps.length) { if (done) done(); return; }
    execStep(steps[i++], next);
  };
  next();
}
function execStep(st, cont) {
  if (!st) return cont();
  if ('n' in st) return showLine(null, textOf(st.n), cont);
  if ('who' in st && 't' in st) { if (st.who !== 'me') setPortrait(st.who); return showLine(st.who, textOf(st.t), cont); }
  if ('show' in st) { setPortrait(st.show); return cont(); }
  if ('bg' in st) { setBg(st.bg, st.opts); return cont(); }
  if ('pause' in st) { later(cont, st.pause); return; }
  if ('clue' in st) { addClue(st.clue); return cont(); }
  if ('do' in st) { st.do(state); if (st.note) toast(st.note, 'info'); updateHUD(); return cont(); }
  if ('if' in st) return runScript(st.if(state) ? st.yes : st.no, cont);
  if ('menu' in st) return showMenu(st.menu, cont);
  cont();
}

function showLine(who, text, cont) {
  const sess = state.vnSession;
  const nameEl = $('#vnName'), textEl = $('#vnText'), nextEl = $('#vnNext');
  if (!textEl) return cont();
  $('#choices').innerHTML = '';
  if (!who) { nameEl.className = 'vn-name narr'; nameEl.textContent = '—'; textEl.className = 'vn-text narr'; }
  else { nameEl.className = 'vn-name' + (who === 'me' ? ' me' : ''); nameEl.innerHTML = who === 'me' ? playerName() : fx(CHARACTERS[who].name); textEl.className = 'vn-text'; }
  textEl.innerHTML = '';
  nextEl.classList.add('hidden');
  Stage.talking = !!who && who !== 'me';
  let typing = true;
  const skip = typeLines(textEl, [text], () => {
    typing = false; Stage.talking = false;
    nextEl.classList.remove('hidden');
  }, { speed: 24, gap: 0, noClick: true });
  state.vnAdvance = () => {
    if (sess !== state.vnSession) return;
    if (typing) { skip(); return; }
    state.vnAdvance = null;
    Sound.click();
    cont();
  };
}

/* 선택지: end가 없는 선택지는 실행 후 메뉴로 돌아온다 */
function showMenu(opts, cont) {
  const sess = state.vnSession;
  state.vnAdvance = null;
  const nextEl = $('#vnNext');
  if (nextEl) nextEl.classList.add('hidden');
  const used = new Set();
  const render = () => {
    if (sess !== state.vnSession) return;
    const box = $('#choices');
    box.innerHTML = '';
    opts.forEach((o, idx) => {
      if ((o.once && used.has(idx)) || (o.if && !o.if(state))) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice' + (o.end ? ' end' : '');
      b.innerHTML = (o.ng ? '<span class="c-yel">↻ </span>' : '') + fx(textOf(o.t));
      b.addEventListener('click', () => {
        if (sess !== state.vnSession) return;
        Sound.click();
        box.innerHTML = '';
        used.add(idx);
        if (o.do) o.do(state);
        if (o.note) toast(o.note, 'info');
        updateHUD();
        runScript(o.then || [], () => (o.end ? cont() : render()));
      });
      box.appendChild(b);
    });
    if (!box.children.length) { cont(); return; }
    const last = box.lastElementChild;
    if (last && last.getBoundingClientRect().bottom > window.innerHeight) last.scrollIntoView({ behavior: 'smooth', block: 'end' });
  };
  render();
}

function startChapter(day) {
  resetState();
  const cs = CHAPTER_STATES[day];
  if (cs) {
    Object.assign(state, JSON.parse(JSON.stringify({ money: cs.money, penalty: cs.penalty, sold: cs.sold, clues: cs.clues, outcomes: cs.outcomes })));
    Object.assign(state.trust, cs.trust); Object.assign(state.flags, cs.flags);
    state.memo.voices = cs.clues.map(id => CLUES[id].voice).filter(Boolean);
  }
  state.day = day;
  startDay();
}

/* =====================================================================
   9. 하루 시작 · 아침 · 규칙
   ===================================================================== */
function startDay() {
  const D = DAYS[state.day] || {};
  state.dayClients = CLIENTS.filter(c => c.day === state.day && (!c.cond || c.cond(state)));
  state.clientIdx = 0;
  state.dayLog = newDayLog();
  state.memo.maintToday = !!state.flags.maintenance; state.flags.maintenance = false;
  state.memo.shakeToday = !!state.flags.selfScanShake; state.flags.selfScanShake = false;
  state.memo.hotToday = !!state.flags.scanHot; state.flags.scanHot = false;
  state.flags.hotNow = false;
  if (activeRules(state.day).registry && !state.memo.registryStarted) {   // 등록제 소급 적용
    state.memo.registryStarted = true;
    (state.memo.erasures || []).forEach(e => state.registered.push(e));
  }
  saveGame();
  if (D.actStart) showActCard(actOf(state.day), showMorning);
  else showMorning();
}

function showActCard(act, then) {
  transition(() => {
    state.screen = 'actcard';
    app.innerHTML = `<section class="screen act-card"><div class="act-no">${act}막</div><div class="act-title" data-text="${ACTS[act].title}">「${ACTS[act].title}」</div>
      <div class="act-days">${ACTS[act].days[0]}일차 — ${ACTS[act].days[1]}일차</div></section>`;
    later(() => { if (state.screen === 'actcard') then(); }, 2600);
    app.querySelector('.act-card').addEventListener('click', () => { if (state.screen === 'actcard') then(); });
  });
}

function scanMultiplier() {
  let m = RULES.some(r => r.day <= state.day && r.scanMul) ? 1.2 : 1;
  if (state.scanBoost) m *= CONFIG.rentScanBoost;
  if (state.memo.maintToday) m *= CONFIG.maintenanceScan;
  if (state.memo.shakeToday) m *= CONFIG.selfScanShake;
  if (state.memo.hotToday) m *= 1.2;
  if (state.flags.hotNow) m *= 1.2;
  return m;
}

function showMorning() {
  const sc = (DAYS[state.day] || {}).morning || { bg: 'clinic', steps: [] };
  transition(() => {
    state.screen = 'morning';

    bindVN();
    runScript(sc.steps, showRules);
  });
